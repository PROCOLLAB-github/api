name: DEV analytics credentials preflight (read-only)

on:
  workflow_dispatch:
    inputs:
      verify_analytics:
        description: Verify the deployed analytics API using read-only requests
        type: boolean
        default: false
      audit_activity:
        description: Compare onboarding and recorded participant activity without changing data
        type: boolean
        default: false
      expected_api_sha:
        description: Expected deployed API commit for analytics verification
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/ops/dev-analytics-credentials-preflight-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare database connection parameters without logging values
        id: parameters
        env:
          DATABASE_NAME: ${{ secrets.DEV_DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DEV_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DEV_DATABASE_PASSWORD }}
          DATABASE_HOST: ${{ secrets.DEV_DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DEV_DATABASE_PORT }}
          EXPECTED_API_SHA: ${{ inputs.expected_api_sha }}
          VERIFY_ANALYTICS: ${{ inputs.verify_analytics }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re

          keys = ("NAME", "USER", "PASSWORD", "HOST", "PORT")
          parameters = {key: os.environ[f"DATABASE_{key}"] for key in keys}
          expected = os.environ["EXPECTED_API_SHA"]
          if os.environ["VERIFY_ANALYTICS"] == "true" and not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("EXPECTED_API_SHA_REQUIRED")
          if any(not value for value in parameters.values()):
              raise SystemExit("DEV_DATABASE_SECRET_MISSING")
          if parameters["NAME"] != "procollab_db_dev":
              raise SystemExit("DEV_DATABASE_NAME_IS_NOT_DEV")
          payload = base64.b64encode(json.dumps(parameters).encode()).decode()
          print(f"::add-mask::{payload}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"payload={payload}\n")
              output.write(f"expected_api_sha={expected}\n")
          PY
      - name: Verify SSH and database secrets without changing DEV
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command: |
            bash -se <<'DEV_VERIFY'
            set -euo pipefail
            test "$(hostname)" = 'procollab-dev'
            cd /root/api
            test -f .env
            printf 'DEV_SSH_AUTH_OK\n'
            printf 'SERVER_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"
            test -z "$(git status --porcelain --untracked-files=no)"
            web=$(docker ps -q --no-trunc --filter 'label=com.docker.compose.project.working_dir=/root/api' --filter 'label=com.docker.compose.service=web')
            [[ "$web" =~ ^[0-9a-f]{64}$ ]]
            docker exec -i "$web" python - <<'PY'
            import base64
            import json
            import os

            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "procollab.settings")
            import django

            django.setup()
            from django.apps import apps
            from django.conf import settings
            from django.db.migrations.executor import MigrationExecutor
            from django.db.utils import ConnectionHandler

            parameters = json.loads(base64.b64decode("${{ steps.parameters.outputs.payload }}"))
            if parameters["NAME"] != "procollab_db_dev":
                raise SystemExit("DEV_DATABASE_NAME_IS_NOT_DEV")
            runtime = settings.DATABASES["default"]
            for key, value in parameters.items():
                same = str(runtime.get(key, "")) == value
                print(f"DATABASE_{key}_MATCHES_RUNTIME={str(same).lower()}")
            config = dict(runtime)
            config.update(parameters)
            config["OPTIONS"] = {
                **runtime.get("OPTIONS", {}),
                "connect_timeout": 10,
            }
            connection = ConnectionHandler({"default": config})["default"]
            try:
                connection.set_autocommit(False)
                with connection.cursor() as cursor:
                    cursor.execute("SET TRANSACTION READ ONLY")
                    cursor.execute("SET LOCAL statement_timeout = '10s'")
                    cursor.execute("SELECT current_database(), current_user")
                    database, user = cursor.fetchone()
                    if (database, user) != (parameters["NAME"], parameters["USER"]):
                        raise SystemExit("DEV_DATABASE_IDENTITY_MISMATCH")
                    cursor.execute("SHOW transaction_read_only")
                    if cursor.fetchone()[0] != "on":
                        raise SystemExit("DEV_DATABASE_READ_ONLY_NOT_ENABLED")
                    tables = sorted({
                        model._meta.db_table
                        for model in apps.get_models(include_auto_created=True)
                        if model._meta.managed and not model._meta.proxy
                    })
                    for privilege in ("SELECT", "INSERT", "UPDATE", "DELETE"):
                        cursor.execute(
                            "SELECT name FROM unnest(%s::text[]) AS t(name) WHERE NOT has_table_privilege(current_user, name, %s)",
                            [tables, privilege],
                        )
                        if cursor.fetchall():
                            raise SystemExit(f"DEV_DATABASE_{privilege}_PRIVILEGES_MISSING")
                executor = MigrationExecutor(connection)
                if executor.migration_plan(executor.loader.graph.leaf_nodes()):
                    raise SystemExit("DEV_PENDING_MIGRATIONS_FOUND")
                print("DEV_GITHUB_DATABASE_AUTH_OK")
                print("DEV_DATABASE_APP_PRIVILEGES_OK")
                print("DEV_MIGRATIONS_CURRENT")
            except SystemExit:
                raise
            except Exception as error:
                message = str(error).lower()
                reason = next((label for fragment, label in (
                    ("password authentication failed", "authentication_failed"),
                    ("unsupported startup parameter", "unsupported_startup_parameter"),
                    ("permission denied", "permission_denied"),
                    ("timeout", "timeout"),
                    ("connection refused", "connection_refused"),
                    ("could not translate host name", "host_name_resolution_failed"),
                ) if fragment in message), "other")
                print(f"DEV_DATABASE_CHECK_REASON={reason}")
                raise SystemExit(f"DEV_DATABASE_CHECK_FAILED={type(error).__name__}") from None
            finally:
                connection.close()
            PY
            if test '${{ inputs.audit_activity }}' = 'true'; then
              docker exec -i "$web" python - <<'PY'
            import json
            import os

            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "procollab.settings")
            import django

            django.setup()
            from django.db import connection, transaction
            from django.db.models import Count, F, Q
            from partner_programs.models import PartnerProgram

            activity = Q(partner_program_profiles__user__last_activity__isnull=False)
            login = Q(partner_program_profiles__user__last_login__isnull=False)
            onboarded = Q(partner_program_profiles__user__onboarding_stage__isnull=True)
            participant = "partner_program_profiles__user_id"
            with transaction.atomic():
                with connection.cursor() as cursor:
                    cursor.execute("SET TRANSACTION READ ONLY")
                    cursor.execute("SET LOCAL statement_timeout = '10s'")
                rows = PartnerProgram.objects.annotate(
                    registered=Count(participant, distinct=True),
                    onboarded=Count(participant, filter=onboarded, distinct=True),
                    recorded_activity=Count(participant, filter=activity, distinct=True),
                    recorded_login=Count(participant, filter=login, distinct=True),
                    recorded_visit=Count(participant, filter=activity | login, distinct=True),
                    onboarded_without_visit=Count(participant, filter=onboarded & ~activity & ~login, distinct=True),
                    login_without_activity=Count(participant, filter=login & ~activity, distinct=True),
                    activity_before_program_registration=Count(
                        participant,
                        filter=Q(partner_program_profiles__user__last_activity__lt=F("partner_program_profiles__datetime_created")),
                        distinct=True,
                    ),
                ).order_by("pk").values(
                    "id", "registered", "onboarded", "recorded_activity", "recorded_login",
                    "recorded_visit", "onboarded_without_visit", "login_without_activity",
                    "activity_before_program_registration",
                )
                print("DEV_ACTIVITY_AUDIT=" + json.dumps(list(rows)))
            print("DEV_ACTIVITY_AUDIT_OK")
            PY
            fi
            if test '${{ inputs.verify_analytics }}' = 'true'; then
              test "$(git rev-parse HEAD)" = '${{ steps.parameters.outputs.expected_api_sha }}'
              docker exec -i "$web" python - <<'PY'
            import inspect
            import io
            import json
            import os

            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "procollab.settings")
            import django

            django.setup()
            from django.contrib.auth import get_user_model
            from django.db import connection, transaction
            from django.db.models import Q
            from django.urls import reverse
            from partner_programs.models import PartnerProgram
            from partner_programs.services.assignment_analytics import build_delayed_experts
            from rest_framework.test import APIClient
            from openpyxl import load_workbook

            source = inspect.getsource(build_delayed_experts)
            assert "evaluation_ends - timedelta(days=5)" in source
            assert "overdue_48h\"] >= 1" not in source
            with transaction.atomic():
                with connection.cursor() as cursor:
                    cursor.execute("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ, READ ONLY")
                    cursor.execute("SET LOCAL statement_timeout = '10s'")
                client = APIClient()
                user_model = get_user_model()
                staff = user_model.objects.filter(Q(is_staff=True) | Q(is_superuser=True), is_active=True).first()
                checked = []
                for program in PartnerProgram.objects.order_by("pk"):
                    manager = program.managers.order_by("pk").first() or staff
                    if manager is None:
                        continue
                    client.force_authenticate(manager)
                    users = user_model.objects.filter(pk__in=program.partner_program_profiles.values("user_id"))
                    visited = users.filter(Q(last_activity__isnull=False) | Q(last_login__isnull=False)).count()
                    never_visited = users.filter(last_activity__isnull=True, last_login__isnull=True)
                    response = client.get(
                        reverse("partner_programs:manager-overview", kwargs={"pk": program.pk}),
                        secure=True, HTTP_HOST="dev.procollab.ru",
                    )
                    assert response.status_code == 200, "DEV_ANALYTICS_OVERVIEW_FAILED"
                    overview = response.data
                    attention = overview["attention"]
                    funnel = overview["participant_funnel"]
                    unfinished = attention["participants_without_visit"]
                    assert funnel["visited_participants"] == visited
                    assert unfinished == never_visited.count()
                    assert unfinished == funnel["unique_participants"] - funnel["visited_participants"]
                    response = client.get(
                        reverse("partner_programs:manager-overview-participants-without-visit", kwargs={"pk": program.pk}),
                        {"limit": 25}, secure=True, HTTP_HOST="dev.procollab.ru",
                    )
                    assert response.status_code == 200, "DEV_ANALYTICS_VISIT_LIST_FAILED"
                    assert response.data["count"] == unfinished
                    expected = set(never_visited.values_list("pk", flat=True))
                    assert all(row["user_id"] in expected for row in response.data["results"])
                    checked.append({"program_id": program.pk, "registered": funnel["unique_participants"], "visited": visited, "without_visit": unfinished})
                    base_query = {"view": "case_analytics", "case_scope": "all"}
                    all_rows = []
                    while True:
                        response = client.get(
                            f"/programs/{program.pk}/projects/",
                            {**base_query, "limit": 100, "offset": len(all_rows)},
                            secure=True, HTTP_HOST="dev.procollab.ru",
                        )
                        assert response.status_code == 200, "DEV_CASE_LIST_FAILED"
                        all_rows.extend(response.data["results"])
                        if len(all_rows) >= response.data["count"]:
                            break
                        assert response.data["results"], "DEV_CASE_PAGINATION_STALLED"
                    combinations = 0
                    submissions = ("all", "submitted", "not_submitted") if program.is_competitive else ("all",)
                    for submission in submissions:
                        for presentation in ("all", "present", "missing"):
                            query = {**base_query, "submission": submission, "presentation": presentation}
                            expected = [row for row in all_rows if
                                (submission == "all" or row["submitted"] == (submission == "submitted"))
                                and (presentation == "all" or bool((row["project"]["presentation_address"] or "").strip()) == (presentation == "present"))
                            ]
                            response = client.get(
                                f"/programs/{program.pk}/projects/", {**query, "limit": 1},
                                secure=True, HTTP_HOST="dev.procollab.ru",
                            )
                            assert response.status_code == 200, "DEV_CASE_FILTER_FAILED"
                            assert response.data["count"] == len(expected), "DEV_CASE_FILTER_COUNT_MISMATCH"
                            assert [row["program_project_id"] for row in response.data["results"]] == [row["program_project_id"] for row in expected[:1]], "DEV_CASE_FILTER_IDS_MISMATCH"
                            response = client.get(
                                f"/programs/{program.pk}/export-projects/", query,
                                secure=True, HTTP_HOST="dev.procollab.ru",
                            )
                            assert response.status_code == 200, "DEV_CASE_EXPORT_FAILED"
                            book = load_workbook(io.BytesIO(response.content), read_only=True)
                            rows = list(book.active.iter_rows(min_row=2, values_only=True))
                            book.close()
                            assert [row[1] or "" for row in rows] == [row["project"]["name"] or "" for row in expected], "DEV_CASE_EXPORT_SELECTION_MISMATCH"
                            combinations += 1
                    print(f"DEV_CASE_FILTERS_OK program_id={program.pk} projects={len(all_rows)} combinations={combinations}")
                assert checked, "DEV_ANALYTICS_NO_ACCESSIBLE_PROGRAM"
                print("DEV_ANALYTICS_VISITS=" + json.dumps(checked))
            print("DEV_ANALYTICS_API_OK")
            PY
            fi
            curl -fsS --max-time 15 -H 'Host: dev.procollab.ru' -H 'X-Forwarded-Proto: https' -o /dev/null http://127.0.0.1:8000/admin/login/
            printf 'DEV_HTTP_OK\nDEV_CREDENTIALS_PREFLIGHT_OK\n'
            DEV_VERIFY
