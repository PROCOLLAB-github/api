name: DEV default project name inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-default-project-name-readonly-20261004
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/ops/dev-default-project-name-check-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect DEV runtime and migration plan without changing data
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command: |
            bash -se 2>&1 <<'DEV_INSPECT'
            set -Eeuo pipefail
            repo=/root/api
            test "$(readlink -f "$repo")" = "$repo"
            grep -Eq 'server_name[[:space:]]+dev\.procollab\.ru;' /etc/nginx/sites-enabled/dev.procollab.ru
            source_sha=$(git --no-optional-locks -C "$repo" rev-parse HEAD)
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            printf 'DEV_SOURCE_SHA=%s\n' "$source_sha"
            df -h /
            for service in web celerys; do
              container=$(docker ps -q --no-trunc --filter "label=com.docker.compose.project.working_dir=$repo" --filter "label=com.docker.compose.service=$service")
              [[ "$container" =~ ^[0-9a-f]{64}$ ]]
              printf 'DEV_SERVICE=%s\n' "$service"
              docker inspect -f '{"image_reference":{{json .Config.Image}},"image_id":{{json .Image}},"status":{{json .State.Status}},"restart_count":{{.RestartCount}}}' "$container"
            done
            image="procollab-dev-api:${source_sha}"
            docker image inspect -f 'DEV_SOURCE_IMAGE={{.Id}}' "$image"
            cd "$repo"
            export DEPLOY_IMAGE="$image"
            docker compose -f docker-compose.dev-ci.yml run --rm --no-deps -T --entrypoint python web - 2>&1 <<'PY'
            import os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'procollab.settings')
            import django
            django.setup()
            from django.db import connection
            from django.db.migrations.executor import MigrationExecutor
            from projects.models import Project
            executor = MigrationExecutor(connection)
            executor.loader.check_consistent_history(connection)
            print('DEV_MIGRATION_HISTORY_CONSISTENT=True', flush=True)
            plan = executor.migration_plan(executor.loader.graph.leaf_nodes())
            print('DEV_PENDING_MIGRATIONS=' + repr([(m.app_label, m.name, backwards) for m, backwards in plan]), flush=True)
            applied = ('projects', '0034_default_project_name') in executor.loader.applied_migrations
            print('DEV_DEFAULT_NAME_MIGRATION_APPLIED=' + str(applied), flush=True)
            print('DEV_MODEL_NAME_DEFAULT=' + repr(Project._meta.get_field('name').get_default()), flush=True)
            from django.db.models import Q
            pattern = '^[\t\n\v\f\r\x1c-\x1f \x85\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*$'
            blanks = Project.objects.filter(Q(name__isnull=True) | Q(name__regex=pattern)).count()
            defaults = Project.objects.filter(name='Проект без названия').count()
            print('DEV_BLANK_PROJECT_NAME_COUNT=' + str(blanks), flush=True)
            print('DEV_DEFAULT_PROJECT_NAME_COUNT=' + str(defaults), flush=True)
            from django.db.models import Count
            from invites.models import Invite
            duplicates = Invite.objects.filter(is_accepted__isnull=True).values('project_id', 'user_id').annotate(count=Count('pk')).filter(count__gt=1)
            print('DEV_DUPLICATE_PENDING_INVITE_GROUP_COUNT=' + str(duplicates.count()), flush=True)
            with connection.cursor() as cursor:
                constraints = connection.introspection.get_constraints(cursor, Invite._meta.db_table)
            print('DEV_PENDING_INVITE_CONSTRAINT_EXISTS=' + str('uniq_legacy_pending_invite' in constraints), flush=True)
            PY
            printf 'DEV_NONINTERACTIVE_MIGRATE_PLAN_BEGIN\n'
            docker compose -f docker-compose.dev-ci.yml run --rm --no-deps -T web python manage.py migrate --plan --noinput 2>&1
            printf 'DEV_NONINTERACTIVE_MIGRATE_PLAN_EXIT=0\n'
            printf 'DEV_READONLY_INSPECTION_COMPLETE=true\n'
            DEV_INSPECT
