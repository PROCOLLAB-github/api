name: Verify merged dev program solutions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned DEV SSH transport
        run: npm install --prefix "$RUNNER_TEMP/dev-verification-ssh" --ignore-scripts --no-package-lock --no-audit --no-fund ssh2@1.16.0
      - name: Verify exact deployed API and rolled-back scenarios
        env:
          NODE_PATH: ${{ runner.temp }}/dev-verification-ssh/node_modules
          DEV_SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
          DEV_SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
          DEV_SERVER_PASSWORD: ${{ secrets.DEV_SERVER_PASSWORD }}
          DEV_SSH_HOST_KEY_SHA256: ${{ vars.DEV_SSH_HOST_KEY_SHA256 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { deploy } = require('./scripts/dev_ci_ssh.cjs');
          const sha = 'e05e16d0cea49773986db4c916dded81ddfa80a6';
          const source = fs.readFileSync('scripts/verify_program_solutions_postmerge_20261026.py', 'utf8');
          const script = [
            'set +x',
            'set -eu',
            'cd /root/api',
            'test "$(git rev-parse HEAD)" = "' + sha + '"',
            'web="$(docker compose -f docker-compose.dev-ci.yml ps -q web)"',
            'worker="$(docker compose -f docker-compose.dev-ci.yml ps -q celerys)"',
            'test -n "$web" && test -n "$worker"',
            'web_image="$(docker inspect -f \'{{.Config.Image}}\' "$web")"',
            'worker_image="$(docker inspect -f \'{{.Config.Image}}\' "$worker")"',
            'case "$web_image" in procollab-dev-api:' + sha + '-*) ;; *) exit 31 ;; esac',
            'test "$web_image" = "$worker_image"',
            'echo "VERIFIED_DEV_RUNTIME_REF=' + sha + '"',
            'docker exec "$web" python manage.py migrate --check',
            'docker exec -e VERIFY_EXPECTED_API_SHA=' + sha + ' -e VERIFY_EXPECTED_LEGACY_IDS=1,2,3,4,5,6,7,8,9,38,39 -i "$web" python - <<\'POSTMERGE_PYTHON\'',
            source,
            'POSTMERGE_PYTHON'
          ].join('\n') + '\n';
          deploy({
            host: process.env.DEV_SERVER_HOST,
            username: process.env.DEV_SERVER_USER,
            password: process.env.DEV_SERVER_PASSWORD,
            hostFingerprint: process.env.DEV_SSH_HOST_KEY_SHA256,
            script,
            timeoutMs: 9 * 60 * 1000
          }).catch(() => { console.error('DEV postmerge verification failed; inspect masked output.'); process.exitCode = 1; });
          NODE
