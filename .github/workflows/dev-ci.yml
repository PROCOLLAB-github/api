name: Deploy Dev

on:
  push:
    branches: 
      - dev
  workflow_dispatch:

jobs:
  deploy:
      name: Deploy
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to server
          uses: garygrossgarten/github-action-ssh@release
          with:
            host: ${{ secrets.DEV_SERVER_HOST }}
            username: ${{ secrets.DEV_SERVER_USER }}
            password: ${{ secrets.DEV_SERVER_PASSWORD }}
            command: |
              set -eu

              cd /root/api
              git fetch --all --tags --prune
              git branch -r --contains "${{ github.sha }}" | grep -q 'origin/dev'
              git checkout --detach "${{ github.sha }}"
              git reset --hard "${{ github.sha }}"
              test "$(git rev-parse HEAD)" = "${{ github.sha }}"
              if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
                echo "Tracked working tree is dirty after reset" >&2
                git status --short --untracked-files=no >&2
                exit 1
              fi

              echo "=== HOST SOURCE ==="
              pwd
              git rev-parse HEAD
              git status --short --untracked-files=all

              echo "HEAD serializers blob:"
              git rev-parse HEAD:vacancy/serializers.py

              echo "working-tree serializers blob:"
              git hash-object vacancy/serializers.py

              echo "working-tree serializers sha256:"
              sha256sum vacancy/serializers.py

              grep -n '"city"' vacancy/serializers.py || true

              expected_serializer_blob="$(git rev-parse HEAD:vacancy/serializers.py)"
              actual_serializer_blob="$(git hash-object vacancy/serializers.py)"
              if [ "$actual_serializer_blob" != "$expected_serializer_blob" ]; then
                echo "Server serializers.py does not match HEAD blob" >&2
                exit 1
              fi

              echo "=== INDEX FLAGS ==="
              git ls-files -v \
                vacancy/serializers.py \
                vacancy/models.py \
                vacancy/migrations/0010_vacancy_city.py || true
              git sparse-checkout list || true

              echo "=== HOST PYTHON CACHE IN BUILD CONTEXT ==="
              find vacancy -maxdepth 3 \
                \( -name '*.pyc' -o -name '__pycache__' \) \
                -print 2>/dev/null | sort
              echo "Python cache exclusions in .dockerignore:"
              grep -En '^(__pycache__/|\*\.py\[cod\])$' .dockerignore || true

              export IMAGE_TAG="${{ github.sha }}"

              rm -f .env
              touch .env

              echo "DJANGO_SECRET_KEY=${{ secrets.DEV_DJANGO_SECRET_KEY }}" >> .env

              echo "DATABASE_NAME=${{ secrets.DEV_DATABASE_NAME }}" >> .env
              echo "DATABASE_PASSWORD=${{ secrets.DEV_DATABASE_PASSWORD }}" >> .env
              echo "DATABASE_USER=${{ secrets.DEV_DATABASE_USER }}" >> .env
              echo "DATABASE_HOST=${{ secrets.DEV_DATABASE_HOST }}" >> .env
              echo "DATABASE_PORT=${{ secrets.DEV_DATABASE_PORT }}" >> .env

              echo "SELECTEL_ACCOUNT_ID=${{ secrets.SELECTEL_ACCOUNT_ID }}" >> .env
              echo "SELECTEL_CONTAINER_NAME=${{ secrets.SELECTEL_CONTAINER_NAME }}" >> .env
              echo "SELECTEL_CONTAINER_PASSWORD=${{ secrets.SELECTEL_CONTAINER_PASSWORD }}" >> .env
              echo "SELECTEL_CONTAINER_USERNAME=${{ secrets.SELECTEL_CONTAINER_USERNAME }}" >> .env

              echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
              echo "UNISENDER_GO_API_KEY=${{ secrets.UNISENDER_GO_API_KEY }}" >> .env

              chmod 600 .env

              docker compose -f docker-compose.dev-ci.yml config >/dev/null
              docker compose -f docker-compose.dev-ci.yml build --no-cache web

              echo "=== IMAGE SOURCE ==="
              docker run --rm \
                --entrypoint sh \
                "procollab-dev-api:${IMAGE_TAG}" \
                -lc '
                  pwd
                  ls -l /procollab/vacancy/serializers.py
                  sha256sum /procollab/vacancy/serializers.py
                  grep -n "\"city\"" /procollab/vacancy/serializers.py || true
                  echo "Duplicate vacancy serializer modules in image:"
                  find / \
                    -path "*/vacancy/serializers.py" \
                    -o -path "*/vacancy/serializers.pyc" \
                    2>/dev/null | sort
                  echo "Python cache in image vacancy package:"
                  find /procollab/vacancy \
                    -maxdepth 2 \
                    \( -name "*.pyc" -o -name "__pycache__" \) \
                    -print 2>/dev/null || true
                '

              docker run --rm -i \
                --env-file .env \
                --entrypoint python \
                "procollab-dev-api:${IMAGE_TAG}" \
                - <<'PY'
              import inspect
              import os
              import sys

              os.environ.setdefault("DJANGO_SETTINGS_MODULE", "procollab.settings")

              import django

              django.setup()

              import vacancy
              import vacancy.serializers as serializers_module
              from vacancy.serializers import (
                  ProjectVacancyCreateListSerializer,
                  VacancyDetailSerializer,
              )

              print("cwd:", os.getcwd())
              print("sys.path:")
              for value in sys.path:
                  print(" ", value)

              print("vacancy package:", vacancy.__file__)
              print("vacancy.serializers module:", serializers_module.__file__)
              print(
                  "create serializer source file:",
                  inspect.getsourcefile(ProjectVacancyCreateListSerializer),
              )
              print(
                  "detail serializer source file:",
                  inspect.getsourcefile(VacancyDetailSerializer),
              )
              print(
                  "create Meta.fields:",
                  ProjectVacancyCreateListSerializer.Meta.fields,
              )
              print("detail Meta.fields:", VacancyDetailSerializer.Meta.fields)
              print(
                  "create runtime fields:",
                  list(ProjectVacancyCreateListSerializer().fields.keys()),
              )
              print(
                  "detail runtime fields:",
                  list(VacancyDetailSerializer().fields.keys()),
              )
              print("CREATE SOURCE:")
              print(inspect.getsource(ProjectVacancyCreateListSerializer))
              print("DETAIL SOURCE:")
              print(inspect.getsource(VacancyDetailSerializer))
              PY

              docker compose -f docker-compose.dev-ci.yml run --rm web python manage.py migrate &&
              docker compose -f docker-compose.dev-ci.yml up -d --force-recreate &&
              expected_image="procollab-dev-api:${IMAGE_TAG}" &&
              for service in web celerys; do
                container="$(docker compose -f docker-compose.dev-ci.yml ps -q "$service")"
                if [ -z "$container" ]; then
                  echo "Service ${service} has no running container" >&2
                  docker compose -f docker-compose.dev-ci.yml ps >&2 || true
                  exit 1
                fi

                actual_image="$(docker inspect -f '{{.Config.Image}}' "$container")"
                echo "Service ${service}: container=${container} image=${actual_image}"
                if [ "$actual_image" != "$expected_image" ]; then
                  echo "Service ${service} uses unexpected image: ${actual_image}, expected ${expected_image}" >&2
                  docker compose -f docker-compose.dev-ci.yml ps >&2 || true
                  exit 1
                fi
              done

              echo "=== RUNNING CONTAINER SOURCE ==="
              docker compose -f docker-compose.dev-ci.yml exec -T web sh -lc '
                pwd
                sha256sum /procollab/vacancy/serializers.py
                grep -n "\"city\"" /procollab/vacancy/serializers.py || true
                echo "Duplicate vacancy serializer modules in running container:"
                find / \
                  -path "*/vacancy/serializers.py" \
                  -o -path "*/vacancy/serializers.pyc" \
                  2>/dev/null | sort
                echo "Python cache in running vacancy package:"
                find /procollab/vacancy \
                  -maxdepth 2 \
                  \( -name "*.pyc" -o -name "__pycache__" \) \
                  -print 2>/dev/null || true
              '

              docker compose -f docker-compose.dev-ci.yml exec -T web python - <<'PY'
              import inspect
              import os
              import sys

              os.environ.setdefault("DJANGO_SETTINGS_MODULE", "procollab.settings")

              import django

              django.setup()

              import vacancy
              import vacancy.serializers as serializers_module
              from vacancy.serializers import (
                  ProjectVacancyCreateListSerializer,
                  VacancyDetailSerializer,
              )

              print("cwd:", os.getcwd())
              print("sys.path:")
              for value in sys.path:
                  print(" ", value)

              print("vacancy package:", vacancy.__file__)
              print("vacancy.serializers module:", serializers_module.__file__)
              print(
                  "create source:",
                  inspect.getsourcefile(ProjectVacancyCreateListSerializer),
              )
              print(
                  "detail source:",
                  inspect.getsourcefile(VacancyDetailSerializer),
              )
              print(
                  "create Meta.fields:",
                  ProjectVacancyCreateListSerializer.Meta.fields,
              )
              print("detail Meta.fields:", VacancyDetailSerializer.Meta.fields)
              print(
                  "create runtime fields:",
                  list(ProjectVacancyCreateListSerializer().fields.keys()),
              )
              print(
                  "detail runtime fields:",
                  list(VacancyDetailSerializer().fields.keys()),
              )
              PY

              docker compose -f docker-compose.dev-ci.yml exec -T web \
                python manage.py showmigrations vacancy

              docker compose -f docker-compose.dev-ci.yml exec -T web python - <<'PY'
              import os

              os.environ.setdefault("DJANGO_SETTINGS_MODULE", "procollab.settings")

              import django

              django.setup()

              from django.db import connection
              from django.db.migrations.recorder import MigrationRecorder

              applied = {
                  (migration.app, migration.name)
                  for migration in MigrationRecorder(connection).migration_qs
              }

              if ("vacancy", "0010_vacancy_city") not in applied:
                  raise SystemExit("vacancy.0010_vacancy_city is not applied")

              print("vacancy.0010_vacancy_city applied")
              PY

              docker compose -f docker-compose.dev-ci.yml exec -T web python - <<'PY'
              import os

              os.environ.setdefault("DJANGO_SETTINGS_MODULE", "procollab.settings")

              import django

              django.setup()

              from vacancy.serializers import (
                  ProjectVacancyCreateListSerializer,
                  VacancyDetailSerializer,
              )

              create_fields = set(ProjectVacancyCreateListSerializer().fields.keys())
              detail_fields = set(VacancyDetailSerializer().fields.keys())

              if "city" not in create_fields:
                  raise SystemExit("Runtime create serializer does not contain city")

              if "city" not in detail_fields:
                  raise SystemExit("Runtime detail serializer does not contain city")

              print("Runtime serializers contain city")
              PY

              install -d /etc/nginx/procollab/includes &&
              install -m 644 deploy/nginx/host/includes/proxy_app.inc /etc/nginx/procollab/includes/proxy_app.inc &&
              install -m 644 deploy/nginx/host/dev/dev.procollab.ru /etc/nginx/sites-available/dev.procollab.ru &&
              ln -sfn /etc/nginx/sites-available/dev.procollab.ru /etc/nginx/sites-enabled/dev.procollab.ru &&
              if [ "$(id -u)" -eq 0 ]; then
                nginx -t &&
                systemctl reload nginx
              else
                sudo nginx -t &&
                sudo systemctl reload nginx
              fi &&

              for attempt in $(seq 1 24); do
                admin_status="$(curl -s -o /dev/null -w '%{http_code}' https://dev.procollab.ru/admin/login/ || true)" &&

                if [ "$admin_status" = "200" ]; then
                  echo "Smoke check passed on attempt ${attempt}" &&
                  break
                fi

                sleep 5
              done &&

              if [ "$admin_status" != "200" ]; then
                echo "Smoke check failed: /admin/login/=${admin_status}" >&2 &&
                exit 1
              fi &&

              docker compose -f docker-compose.dev-ci.yml ps

              celery_status=""
              celery_ping=""
              celery_container=""
              for attempt in $(seq 1 12); do
                celery_container="$(docker compose -f docker-compose.dev-ci.yml ps -q celerys 2>/dev/null || true)"
                if [ -n "$celery_container" ]; then
                  celery_status="$(docker inspect -f '{{.State.Status}}' "$celery_container" 2>/dev/null || true)"
                else
                  celery_status="missing"
                fi

                echo "Celery check attempt ${attempt}: container=${celery_container:-missing} status=${celery_status}"
                if [ "$celery_status" = "running" ]; then
                  celery_ping="$(docker compose -f docker-compose.dev-ci.yml exec -T celerys sh -lc 'celery -A procollab inspect ping --timeout=15' 2>&1 || true)"
                  printf '%s\n' "$celery_ping"
                  if printf '%s\n' "$celery_ping" | grep -q 'pong'; then
                    echo "Celery check passed on attempt ${attempt}"
                    break
                  fi
                fi

                sleep 5
              done

              if [ "$celery_status" != "running" ] || ! printf '%s\n' "$celery_ping" | grep -q 'pong'; then
                echo "Celery check failed: status=${celery_status}" >&2
                docker compose -f docker-compose.dev-ci.yml ps >&2 || true
                docker compose -f docker-compose.dev-ci.yml logs --tail=200 celerys >&2 || true
                docker compose -f docker-compose.dev-ci.yml logs --tail=100 redis >&2 || true
                docker compose -f docker-compose.dev-ci.yml logs --tail=100 web >&2 || true
                exit 1
              fi
