name: DEV disk inspection and unused build cache cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Только диагностика либо согласованная очистка неиспользуемого build cache
        type: choice
        options: [inspect, cleanup-cache]
        default: inspect
        required: true
      confirmation:
        description: Введите DEV_DISK_RECOVERY
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: dev-disk-recovery-20260920
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/ops/dev-disk-recovery-20260920' && inputs.confirmation == 'DEV_DISK_RECOVERY' && (inputs.mode == 'inspect' || inputs.mode == 'cleanup-cache')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: DEV disk diagnostics or unused cache cleanup only
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command: |
            bash -se <<'DEV_DISK'
            set -Eeuo pipefail
            test '${{ github.run_attempt }}' = 1
            test "$(id -u)" = 0
            repo=/root/api
            test "$(readlink -f "$repo")" = "$repo"
            grep -Eq 'server_name[[:space:]]+dev\.procollab\.ru;' /etc/nginx/sites-enabled/dev.procollab.ru
            mode='${{ inputs.mode }}'
            case "$mode" in inspect|cleanup-cache) ;; *) exit 1;; esac

            # Не выводим environment контейнеров, конфигурацию приложения и содержимое файлов.
            runtime() {
              local service container
              for service in web celerys; do
                container=$(docker ps -aq --no-trunc --filter "label=com.docker.compose.project.working_dir=$repo" --filter "label=com.docker.compose.service=$service")
                [[ "$container" =~ ^[0-9a-f]{64}$ ]]
                printf 'SERVICE=%s\n' "$service"
                docker inspect -f '{"container_id":{{json .Id}},"image_reference":{{json .Config.Image}},"image_id":{{json .Image}},"status":{{json .State.Status}},"started_at":{{json .State.StartedAt}},"restart_count":{{json .RestartCount}}}' "$container"
              done
            }
            images() { docker image ls -a --no-trunc --digests --format '{{.ID}} {{.Repository}} {{.Tag}} {{.Digest}}' | LC_ALL=C sort | sha256sum; }
            volumes() { docker volume ls --format '{{.Driver}} {{.Name}}' | LC_ALL=C sort | sha256sum; }
            containers() {
              local container
              for container in $(docker ps -aq --no-trunc); do
                docker inspect -f '{{.Id}} {{.Image}} {{.State.Status}} {{.State.StartedAt}} {{.RestartCount}}' "$container"
              done | LC_ALL=C sort | sha256sum
            }
            server_sha=$(git --no-optional-locks -C "$repo" rev-parse HEAD)
            runtime_before=$(runtime)
            printf 'MODE=%s\nSERVER_GIT_SHA=%s\nRUNTIME_BEFORE\n%s\n' "$mode" "$server_sha" "$runtime_before"
            printf 'DISK_BEFORE\n'
            df -h
            df -i
            docker system df
            # Без столбца COMMAND: аргументы процессов не нужны для оценки занятого места.
            docker ps -a --no-trunc --format 'table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Names}}'
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'
            printf 'DOCKER_USAGE_DETAIL\n'
            docker system df -v
            printf 'DIRECTORY_SIZES\n'
            for directory in /var/lib/docker /var/lib/containerd /var/log /var/cache/apt/archives /root/api /root/procollab-dev-rollback /home/front/app; do
              if test -d "$directory"; then du -xsh "$directory"; fi
            done

            if test "$mode" = cleanup-cache; then
              test "$server_sha" = af8be9575df6251748da3f93959dd9be38daaddb
              images_before=$(images)
              volumes_before=$(volumes)
              containers_before=$(containers)
              # Удаляется только неиспользуемый кеш сборки. Образы и volumes не очищаются.
              docker builder prune --all --force
              test "$(images)" = "$images_before"
              test "$(volumes)" = "$volumes_before"
              test "$(containers)" = "$containers_before"
              printf 'IMAGES_UNCHANGED=true\nVOLUMES_UNCHANGED=true\nCONTAINERS_UNCHANGED=true\n'
            fi
            printf 'DISK_AFTER\n'
            df -h
            docker system df
            runtime_after=$(runtime)
            test "$runtime_after" = "$runtime_before"
            test "$(git --no-optional-locks -C "$repo" rev-parse HEAD)" = "$server_sha"
            printf 'RUNTIME_AFTER\n%s\nRUNTIME_UNCHANGED=true\n' "$runtime_after"
            printf 'DEV_DISK_OPERATION_COMPLETE=true\n'
            DEV_DISK
