name: DEV migration permissions inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/ops/dev-default-project-name-check-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect DEV table ownership without changing permissions
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command: |
            bash -se 2>&1 <<'DEV_PERMISSIONS'
            set -Eeuo pipefail
            repo=/root/api
            test "$(readlink -f "$repo")" = "$repo"
            grep -Eq 'server_name[[:space:]]+dev\.procollab\.ru;' /etc/nginx/sites-enabled/dev.procollab.ru
            cd "$repo"
            source_sha=$(git --no-optional-locks rev-parse HEAD)
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            export DEPLOY_IMAGE="procollab-dev-api:${source_sha}"
            printf 'DEV_SOURCE_SHA=%s\n' "$source_sha"
            command -v psql || true
            if id -u postgres >/dev/null 2>&1; then printf 'DEV_LOCAL_POSTGRES_OS_ACCOUNT=true\n'; else printf 'DEV_LOCAL_POSTGRES_OS_ACCOUNT=false\n'; fi
            docker ps --format '{{.Names}} {{.Image}}' | grep -i postgres || true
            docker compose -f docker-compose.dev-ci.yml run --rm --no-deps -T --entrypoint python web - <<'PY'
            import os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'procollab.settings')
            import django
            django.setup()
            from django.conf import settings
            from django.db import connection
            host = settings.DATABASES['default']['HOST']
            print('DEV_DB_HOST_IS_LOOPBACK=' + str(host in ('', 'localhost', '127.0.0.1', '::1')), flush=True)
            with connection.cursor() as cursor:
                cursor.execute('SET default_transaction_read_only = on')
                cursor.execute('SELECT rolsuper, rolcreaterole FROM pg_roles WHERE rolname = current_user')
                print('DEV_DB_ROLE_ADMIN_FLAGS=' + repr(cursor.fetchone()), flush=True)
                cursor.execute("SELECT c.relname, pg_has_role(current_user, c.relowner, 'USAGE') FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname=current_schema() AND c.relname IN ('invites_invite', 'projects_project', 'django_migrations') ORDER BY c.relname")
                print('DEV_CAN_ALTER_TABLES=' + repr(cursor.fetchall()), flush=True)
                cursor.execute("SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname=current_schema() AND c.relkind='r' AND NOT pg_has_role(current_user, c.relowner, 'USAGE')")
                print('DEV_NONOWNED_TABLE_COUNT=' + str(cursor.fetchone()[0]), flush=True)
                cursor.execute("SELECT pg_has_role(current_user, relowner, 'MEMBER') FROM pg_class WHERE oid='invites_invite'::regclass")
                print('DEV_CAN_SET_INVITE_OWNER_ROLE=' + str(cursor.fetchone()[0]), flush=True)
            PY
            printf 'DEV_READONLY_PERMISSION_INSPECTION_COMPLETE=true\n'
            DEV_PERMISSIONS
