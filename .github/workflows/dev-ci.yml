name: DEV preflight and rollback snapshot (no deploy)

on:
  workflow_dispatch:
    inputs:
      cleanup_cache:
        description: "Только согласованная очистка неиспользуемого DEV build cache"
        type: boolean
        default: false
      verify_only:
        description: "Только read-only проверка reset-cover deploy, без нового snapshot"
        type: boolean
        default: false
      frontend_state:
        description: "Ожидаемое состояние frontend относительно snapshot"
        type: choice
        options: [snapshot, changed]
        default: snapshot

permissions:
  contents: read

concurrency:
  group: dev-preflight-snapshot
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/ops/dev-widget-preflight-20260915' && inputs.verify_only != true && inputs.cleanup_cache != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect DEV and preserve existing runtime artifacts
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command: |
            bash -se <<'DEV_PREFLIGHT'
            export PREFLIGHT_RUN_ID='${{ github.run_id }}'
            export PREFLIGHT_RUN_ATTEMPT='${{ github.run_attempt }}'
            #!/usr/bin/env bash
            # DEV-only inspection and static frontend backup. No runtime mutations.
            set -Eeuo pipefail
            umask 077
            stage=guards
            trap 'printf "PREFLIGHT_FAILED stage=%s line=%s; no automatic retry\n" "$stage" "$LINENO" >&2' ERR
            test "$(id -u)" = 0
            : "${PREFLIGHT_RUN_ID:?numeric Actions run ID required}"
            : "${PREFLIGHT_RUN_ATTEMPT:?numeric Actions run attempt required}"
            [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
            test "$PREFLIGHT_RUN_ATTEMPT" = 1

            repo=/root/api
            front=/home/front/app
            base=/root/procollab-dev-rollback
            test "$(readlink -f "$repo")" = "$repo"
            test "$(readlink -f "$front")" = "$front"
            test -f "$repo/docker-compose.dev-ci.yml"
            test -f "$front/index.html"
            test -f "$front/main.js"
            test -f "$front/styles.css"
            grep -Eq 'server_name[[:space:]]+dev\.procollab\.ru;' /etc/nginx/sites-enabled/dev.procollab.ru
            grep -Eq 'root[[:space:]]+/home/front/app;' /etc/nginx/sites-enabled/dev.procollab.ru
            # A directory snapshot must contain the whole build, not external symlink targets.
            test -z "$(find "$front" ! -type f ! -type d -print -quit)"
            # Refuse credential files and database dumps without logging their contents.
            if find "$front" -printf '%P\n' | grep -Ei '(^|/)(\.env($|[./])|\.git($|/)|\.ssh($|/)|id_(rsa|dsa|ecdsa|ed25519)($|\.)|credentials($|\.)|secrets?($|\.)|passwords?($|\.)|tokens?($|\.)|[^/]*\.(key|pem|p12|pfx|jks|keystore|sql|sqlite3?|db|dump|bak)$)' >/dev/null; then
              printf 'Refusing frontend snapshot: sensitive or unexpected file name\n' >&2
              exit 1
            else
              test "$?" = 1
            fi
            if grep -rIE -- '-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|AKIA[0-9A-Z]{16}' "$front" >/dev/null; then
              printf 'Refusing frontend snapshot: credential marker detected\n' >&2
              exit 1
            else
              test "$?" = 1
            fi
            cd "$repo"
            container_for() {
              docker ps -q --no-trunc --filter "label=com.docker.compose.project.working_dir=$repo" --filter "label=com.docker.compose.service=$1"
            }
            web=$(container_for web)
            celery=$(container_for celerys)
            [[ "$web" =~ ^[0-9a-f]{64}$ ]]
            [[ "$celery" =~ ^[0-9a-f]{64}$ ]]
            project=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$web")
            [[ "$project" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
            for container in "$web" "$celery"; do
              test "$(docker inspect -f '{{.State.Status}}' "$container")" = running
              test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$container")" = "$repo"
              test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$container")" = "$project"
              reference=$(docker inspect -f '{{.Config.Image}}' "$container")
              [[ "$reference" == procollab-dev-api:* ]]
            done
            test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$web")" = web
            test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$celery")" = celerys
            web_image=$(docker inspect -f '{{.Image}}' "$web")
            celery_image=$(docker inspect -f '{{.Image}}' "$celery")
            [[ "$web_image" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$celery_image" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$(docker image inspect -f '{{.Id}}' "$web_image")" = "$web_image"
            test "$(docker image inspect -f '{{.Id}}' "$celery_image")" = "$celery_image"
            server_sha=$(git rev-parse HEAD)
            [[ "$server_sha" =~ ^[0-9a-f]{40}$ ]]
            # Снимок перед #351 разрешён только для проверенного DEV после #743/#350.
            test "$server_sha" = dd3d48b121a1fd0668857c9b8766bb588be2360b
            test -z "$(git status --porcelain --untracked-files=no)"
            test "$web_image" = sha256:2f568147f6dea7a56fa1ee51e252545d299115e75063d6fa47ff896ef40037ea
            test "$celery_image" = "$web_image"
            test "$(sha256sum "$front/index.html" | cut -d' ' -f1)" = 49122cd7ef675e9238eb5555bc2592afb43dca6ba3cb849abd3c0329e7bcc800
            test "$(sha256sum "$front/main.js" | cut -d' ' -f1)" = fa0f9692dbdb13025597f089215c11887a9bf6152b7c011bffa11681612a80df
            test "$(sha256sum "$front/styles.css" | cut -d' ' -f1)" = d0de585599a7a9bd7d927a3bf3ae0ec8b0cbe34514928c81e687f4a8a26a7570

            smoke() {
              local root_status admin_status token_status
              root_status=$(curl --silent --show-error --max-time 20 --resolve dev.procollab.ru:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://dev.procollab.ru/)
              admin_status=$(curl --silent --show-error --max-time 20 --resolve dev.procollab.ru:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://dev.procollab.ru/admin/login/)
              token_status=$(curl --silent --show-error --max-time 20 --resolve dev.procollab.ru:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://dev.procollab.ru/api/token/)
              printf 'SMOKE root=%s admin=%s token_get=%s\n' "$root_status" "$admin_status" "$token_status"
              test "$root_status" = 200
              test "$admin_status" = 200
              test "$token_status" = 405
            }
            stage=initial-smoke
            smoke

            # All filesystem writes below go to a new private backup directory.
            # No backend files, environment, image archives or business data are copied.
            stage=backup-directory
            test ! -L "$base"
            if test ! -e "$base"; then mkdir -m 700 "$base"; fi
            test -d "$base"
            test "$(stat -c '%u:%a' "$base")" = '0:700'
            test "$(readlink -f "$base")" = "$base"
            snapshot="$base/$(date -u +%Y%m%dT%H%M%SZ)-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}"
            mkdir -m 700 "$snapshot"
            touch "$snapshot/INCOMPLETE"
            printf 'SNAPSHOT=%s\n' "$snapshot"
            front_size=$(du -sb "$front" | cut -f1)
            available=$(df -PB1 "$base" | awk 'NR==2 {print $4}')
            required=$((front_size * 2 + 1073741824))
            test "$available" -gt "$required"

            printf '%s\n' "$server_sha" > "$snapshot/server-git-sha.txt"
            git status --porcelain --untracked-files=no > "$snapshot/server-tracked-status.txt"
            sha256sum "$repo/docker-compose.dev-ci.yml" > "$snapshot/compose-source.sha256"
            runtime() {
              # Only safe runtime fields; never environment, health output or mounts.
              docker inspect -f '{"container_id":{{json .Id}},"image_reference":{{json .Config.Image}},"image_id":{{json .Image}},"status":{{json .State.Status}},"started_at":{{json .State.StartedAt}},"restart_count":{{json .RestartCount}}}' "$1"
            }
            for service in web celerys; do
              container=$(container_for "$service")
              # Deliberately excludes environment variables, mounts, and application data.
              runtime "$container" > "$snapshot/$service.json"
            done

            # Только чтение: состояние миграций, работа воркера и конфигурация nginx.
            stage=operational-inspection
            docker compose -f docker-compose.dev-ci.yml ps --services --filter status=running > "$snapshot/compose-running-services.txt"
            grep -qx web "$snapshot/compose-running-services.txt"
            grep -qx celerys "$snapshot/compose-running-services.txt"
            docker exec "$web" python manage.py showmigrations --plan > "$snapshot/migrations.txt"
            if grep -q '^\[ \]' "$snapshot/migrations.txt"; then
              printf 'Pending migrations detected; snapshot remains INCOMPLETE\n' >&2
              exit 1
            fi
            docker exec "$celery" celery -A procollab inspect ping --timeout=15 > "$snapshot/celery-ping.txt"
            grep -q pong "$snapshot/celery-ping.txt"
            nginx -t > "$snapshot/nginx-test.txt" 2>&1
            sha256sum /etc/nginx/nginx.conf /etc/nginx/sites-enabled/dev.procollab.ru /etc/nginx/procollab/includes/proxy_app.inc > "$snapshot/nginx-config.sha256"

            manifest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum); }
            metadata() { (cd "$1" && find . -printf '%y %m %U %G %s %T@ %p\n' | LC_ALL=C sort); }
            stage=frontend-backup
            manifest "$front" > "$snapshot/frontend.sha256"
            metadata "$front" > "$snapshot/frontend-files.txt"
            mkdir "$snapshot/frontend"
            cp -a "$front/." "$snapshot/frontend/"
            manifest "$snapshot/frontend" > "$snapshot/frontend-copy.sha256"
            manifest "$front" > "$snapshot/frontend-after.sha256"
            cmp "$snapshot/frontend.sha256" "$snapshot/frontend-copy.sha256"
            cmp "$snapshot/frontend.sha256" "$snapshot/frontend-after.sha256"
            python3 - "$snapshot/frontend/index.html" > "$snapshot/primary-assets.txt" <<'PY'
            import re
            import sys
            from pathlib import Path

            html = Path(sys.argv[1]).read_text()
            assets = sorted(set(re.findall(r'(?:src|href)="([^"?#]+\.(?:js|css))"', html)))
            assert assets, "Primary assets отсутствуют"
            for asset in assets:
                assert re.fullmatch(r'[A-Za-z0-9_.-]+\.(js|css)', asset), "Неожиданный путь asset"
                print(asset)
            PY
            while IFS= read -r asset; do
              status=$(curl --silent --show-error --max-time 20 --resolve dev.procollab.ru:443:127.0.0.1 -o /dev/null -w '%{http_code}' "https://dev.procollab.ru/$asset")
              printf '%s %s\n' "$status" "$asset" >> "$snapshot/primary-assets-smoke.txt"
              test "$status" = 200
            done < "$snapshot/primary-assets.txt"

            printf 'services:\n  web:\n    image: "%s"\n  celerys:\n    image: "%s"\n' "$web_image" "$celery_image" > "$snapshot/rollback-images.yml"
            printf '%s\n' "$project" > "$snapshot/compose-project.txt"

            # Reject a concurrent deployment or files changing during capture.
            stage=verify-unchanged
            test "$(container_for web)" = "$web"
            test "$(container_for celerys)" = "$celery"
            test "$(docker inspect -f '{{.Image}}' "$web")" = "$web_image"
            test "$(docker inspect -f '{{.Image}}' "$celery")" = "$celery_image"
            test "$(docker image inspect -f '{{.Id}}' "$web_image")" = "$web_image"
            test "$(docker image inspect -f '{{.Id}}' "$celery_image")" = "$celery_image"
            test "$(git rev-parse HEAD)" = "$server_sha"
            test "$(docker inspect -f '{{.State.Status}}' "$web")" = running
            test "$(docker inspect -f '{{.State.Status}}' "$celery")" = running
            runtime "$web" > "$snapshot/web-after.json"
            runtime "$celery" > "$snapshot/celerys-after.json"
            cmp "$snapshot/web.json" "$snapshot/web-after.json"
            cmp "$snapshot/celerys.json" "$snapshot/celerys-after.json"
            git status --porcelain --untracked-files=no > "$snapshot/server-tracked-status-after.txt"
            cmp "$snapshot/server-tracked-status.txt" "$snapshot/server-tracked-status-after.txt"
            sha256sum --check --status "$snapshot/compose-source.sha256"
            manifest "$front" > "$snapshot/frontend-final.sha256"
            cmp "$snapshot/frontend.sha256" "$snapshot/frontend-final.sha256"
            metadata "$front" > "$snapshot/frontend-files-after.txt"
            cmp "$snapshot/frontend-files.txt" "$snapshot/frontend-files-after.txt"
            sha256sum --check --status "$snapshot/nginx-config.sha256"
            smoke
            (cd "$snapshot" && sha256sum server-git-sha.txt compose-project.txt compose-source.sha256 server-tracked-status.txt web.json celerys.json rollback-images.yml frontend.sha256 frontend-files.txt compose-running-services.txt migrations.txt celery-ping.txt nginx-test.txt nginx-config.sha256 primary-assets.txt primary-assets-smoke.txt > SHA256SUMS)
            mv "$snapshot/INCOMPLETE" "$snapshot/COMPLETE"
            test -f "$snapshot/COMPLETE"
            test ! -e "$snapshot/INCOMPLETE"

            # Receipt contains only version, integrity and runtime metadata.
            printf 'SNAPSHOT=%s\nSERVER_GIT_SHA=%s\nCOMPOSE_PROJECT=%s\n' "$snapshot" "$server_sha" "$project"
            printf 'WEB\n'; cat "$snapshot/web.json"
            printf 'CELERYS\n'; cat "$snapshot/celerys.json"
            printf 'TRACKED_CHANGED_FILE_COUNT=%s\n' "$(wc -l < "$snapshot/server-tracked-status.txt")"
            printf 'BACKUP_CHECKSUMS_BEGIN\n'
            cat "$snapshot/SHA256SUMS"
            printf 'BACKUP_CHECKSUMS_END\n'
            sha256sum "$snapshot/SHA256SUMS"
            printf 'FRONTEND_MANIFEST_BEGIN\n'
            cat "$snapshot/frontend.sha256"
            printf 'FRONTEND_MANIFEST_END\n'
            printf 'FRONTEND_FILE_COUNT=%s\n' "$(find "$front" -type f | wc -l)"
            printf 'RUNTIME_UNCHANGED=true\nLOCAL_RUNNING_IMAGES_PRESENT=true\n'
            printf 'MIGRATIONS_ALL_APPLIED=true\nNGINX_TEST=true\nCELERY_PING=pong\n'
            printf 'PRIMARY_ASSETS_SMOKE_BEGIN\n'; cat "$snapshot/primary-assets-smoke.txt"
            printf 'PRIMARY_ASSETS_SMOKE_END\n'
            printf 'SNAPSHOT_COMPLETE=true\n'
            printf 'COMPLETE: DEV inspection and static frontend backup only\n'

            DEV_PREFLIGHT

  verify:
    if: github.ref == 'refs/heads/ops/dev-widget-preflight-20260915' && inputs.verify_only == true && inputs.cleanup_cache != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify DEV runtime read-only
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command: |
            bash -se <<'DEV_VERIFY'
            # Ни одна команда проверки не меняет source, контейнеры, файлы сборки или БД.
            set -Eeuo pipefail
            test '${{ github.run_attempt }}' = 1
            repo=/root/api
            snapshot=/root/procollab-dev-rollback/20260918T122725Z-35344739528-1
            expected=dd3d48b121a1fd0668857c9b8766bb588be2360b
            frontend_state='${{ inputs.frontend_state }}'
            case "$frontend_state" in snapshot|changed) ;; *) exit 1;; esac
            # Диагностика отказа snapshot #351: только размеры, без очистки файлов/образов.
            front_size=$(du -sb /home/front/app | cut -f1)
            available=$(df -PB1 /root/procollab-dev-rollback | awk 'NR==2 {print $4}')
            printf 'DISK_AVAILABLE_BYTES=%s\nFRONTEND_SIZE_BYTES=%s\nSNAPSHOT_REQUIRED_BYTES=%s\n' "$available" "$front_size" "$((front_size * 2 + 1073741824))"
            docker system df
            du -sh /var/log /var/cache/apt/archives /root/procollab-dev-rollback
            test -f /root/procollab-dev-rollback/20260918T114436Z-35341114541-1/INCOMPLETE
            test ! -e /root/procollab-dev-rollback/20260918T114436Z-35341114541-1/COMPLETE
            printf 'FAILED_SNAPSHOT_INCOMPLETE=true\n'
            test "$(readlink -f "$repo")" = "$repo"
            test "$(readlink -f /home/front/app)" = /home/front/app
            test -f "$snapshot/COMPLETE"
            test ! -e "$snapshot/INCOMPLETE"
            test "$(sha256sum "$snapshot/SHA256SUMS" | cut -d' ' -f1)" = 9343575209f708bb84bf242357467490e41de98237124d032c44c91901089fc4
            (cd "$snapshot" && sha256sum --check --status SHA256SUMS)
            cd "$repo"
            test "$(git rev-parse HEAD)" = "$expected"
            test -z "$(git status --porcelain --untracked-files=no)"
            printf 'SERVER_GIT_SHA=%s\n' "$expected"
            container_for() {
              docker ps -q --no-trunc --filter "label=com.docker.compose.project.working_dir=$repo" --filter "label=com.docker.compose.service=$1"
            }
            web=$(container_for web)
            celery=$(container_for celerys)
            [[ "$web" =~ ^[0-9a-f]{64}$ ]]
            [[ "$celery" =~ ^[0-9a-f]{64}$ ]]
            image=$(docker inspect -f '{{.Image}}' "$web")
            for container in "$web" "$celery"; do
              test "$(docker inspect -f '{{.State.Status}}' "$container")" = running
              test "$(docker inspect -f '{{.Image}}' "$container")" = "$image"
              reference=$(docker inspect -f '{{.Config.Image}}' "$container")
              [[ "$reference" == "procollab-dev-api:$expected-"* ]]
              docker inspect -f '{"container_id":{{json .Id}},"image_reference":{{json .Config.Image}},"image_id":{{json .Image}},"status":{{json .State.Status}}}' "$container"
            done
            test "$(docker image inspect -f '{{.Id}}' "$image")" = "$image"
            docker exec -i "$web" python - <<'PY'
            import os
            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "procollab.settings")
            import django
            django.setup()
            from django.urls import resolve
            from projects.serializers import ProjectDetailSerializer
            from projects.views import ProjectDetail, ProjectResetCover
            assert "is_default_cover" in ProjectDetailSerializer().fields
            assert resolve("/projects/1/reset-cover/").func.view_class is ProjectResetCover
            assert ProjectResetCover.permission_classes is ProjectDetail.permission_classes
            print("RUNTIME_IS_DEFAULT_COVER=true")
            print("RUNTIME_RESET_ROUTE=true")
            print("PROJECT_PERMISSIONS_UNCHANGED=true")
            PY
            docker exec "$web" sha256sum /procollab/projects/cover_reset.py /procollab/projects/serializers.py /procollab/projects/views.py
            migration_hash=$(docker exec "$web" python manage.py showmigrations --plan | sha256sum | cut -d' ' -f1)
            test "$migration_hash" = "$(sha256sum "$snapshot/migrations.txt" | cut -d' ' -f1)"
            printf 'MIGRATION_STATE_UNCHANGED=true\n'
            # Сначала дочитываем вывод Docker: ранний выход grep -q даёт SIGPIPE при pipefail.
            celery_ping=$(docker exec "$celery" celery -A procollab inspect ping --timeout=15)
            grep -q pong <<< "$celery_ping"
            printf 'CELERY_PING=pong\n'
            nginx -t
            frontend_hash=$(cd /home/front/app && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            previous_hash=$(sha256sum "$snapshot/frontend.sha256" | cut -d' ' -f1)
            if test "$frontend_state" = snapshot; then test "$frontend_hash" = "$previous_hash"; else test "$frontend_hash" != "$previous_hash"; fi
            printf 'FRONTEND_MANIFEST_SHA256=%s\nFRONTEND_STATE=%s\n' "$frontend_hash" "$frontend_state"
            printf 'FRONTEND_FILE_COUNT=%s\n' "$(find /home/front/app -type f | wc -l)"
            for item in /:200 /admin/login/:200 /api/token/:405; do
              url=${item%:*}
              status=$(curl --silent --show-error --max-time 20 --resolve dev.procollab.ru:443:127.0.0.1 -o /dev/null -w '%{http_code}' "https://dev.procollab.ru$url")
              test "$status" = "${item##*:}"
              printf 'SMOKE %s %s\n' "$url" "$status"
            done
            printf 'READ_ONLY_VERIFY_COMPLETE=true\n'
            DEV_VERIFY

  cleanup:
    if: github.ref == 'refs/heads/ops/dev-widget-preflight-20260915' && inputs.cleanup_cache == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove only unused DEV build cache
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command: |
            bash -se <<'DEV_CACHE'
            # Разрешена только очистка неиспользуемого кеша сборки перед deploy #351.
            set -Eeuo pipefail
            test '${{ github.run_attempt }}' = 1
            test "$(id -u)" = 0
            repo=/root/api
            front=/home/front/app
            backups=/root/procollab-dev-rollback
            test "$(readlink -f "$repo")" = "$repo"
            test "$(readlink -f "$front")" = "$front"
            test "$(readlink -f "$backups")" = "$backups"
            grep -Eq 'server_name[[:space:]]+dev\.procollab\.ru;' /etc/nginx/sites-enabled/dev.procollab.ru
            test "$(git -C "$repo" rev-parse HEAD)" = dd3d48b121a1fd0668857c9b8766bb588be2360b
            test -z "$(git -C "$repo" status --porcelain --untracked-files=no)"
            manifest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1); }
            images() { docker image ls -a --no-trunc --digests --format '{{.ID}} {{.Repository}} {{.Tag}} {{.Digest}}' | LC_ALL=C sort | sha256sum | cut -d' ' -f1; }
            volumes() { docker volume ls --format '{{.Driver}} {{.Name}}' | LC_ALL=C sort | sha256sum | cut -d' ' -f1; }
            containers() {
              for container in $(docker ps -aq --no-trunc); do
                docker inspect -f '{{.Id}} {{.Image}} {{.State.Status}} {{.State.StartedAt}} {{.RestartCount}}' "$container"
              done | LC_ALL=C sort | sha256sum | cut -d' ' -f1
            }
            for service in web celerys; do
              container=$(docker ps -q --no-trunc --filter "label=com.docker.compose.project.working_dir=$repo" --filter "label=com.docker.compose.service=$service")
              [[ "$container" =~ ^[0-9a-f]{64}$ ]]
              test "$(docker inspect -f '{{.State.Status}}' "$container")" = running
              test "$(docker inspect -f '{{.Image}}' "$container")" = sha256:2f568147f6dea7a56fa1ee51e252545d299115e75063d6fa47ff896ef40037ea
            done
            front_before=$(manifest "$front")
            test "$front_before" = d6d532c54a3e030a197fd73349d9b4c222e0d19830bf60ce3edace166db7b8c2
            backups_before=$(manifest "$backups")
            images_before=$(images)
            volumes_before=$(volumes)
            containers_before=$(containers)
            before_free=$(df -PB1 "$backups" | awk 'NR==2 {print $4}')
            printf 'DISK_AVAILABLE_BEFORE=%s\n' "$before_free"
            # В отличие от system/image/volume prune, эта команда удаляет только кеш сборки.
            docker builder prune --all --force
            test "$(images)" = "$images_before"
            test "$(volumes)" = "$volumes_before"
            test "$(containers)" = "$containers_before"
            test "$(manifest "$front")" = "$front_before"
            test "$(manifest "$backups")" = "$backups_before"
            test "$(git -C "$repo" rev-parse HEAD)" = dd3d48b121a1fd0668857c9b8766bb588be2360b
            after_free=$(df -PB1 "$backups" | awk 'NR==2 {print $4}')
            front_size=$(du -sb "$front" | cut -f1)
            required=$((front_size * 2 + 1073741824))
            printf 'DISK_AVAILABLE_AFTER=%s\nSNAPSHOT_REQUIRED_BYTES=%s\n' "$after_free" "$required"
            printf 'IMAGES_UNCHANGED=true\nVOLUMES_UNCHANGED=true\nCONTAINERS_UNCHANGED=true\nFRONTEND_UNCHANGED=true\nSNAPSHOTS_UNCHANGED=true\n'
            test "$after_free" -gt "$required"
            printf 'CACHE_CLEANUP_COMPLETE=true\n'
            DEV_CACHE
