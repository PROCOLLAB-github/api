name: DEV branding acceptance (temporary)
on:
  workflow_dispatch:
    inputs:
      expected_api:
        required: true
        type: string
permissions:
  contents: read
jobs:
  branding:
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --prefix "$RUNNER_TEMP/branding-test" --no-audit --no-fund ssh2@1.16.0 playwright pngjs
      - run: "$RUNNER_TEMP/branding-test/node_modules/.bin/playwright" install chromium
      - run: node scripts/qa_dev_branding.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/branding-test/node_modules
          EXPECTED_API: ${{ inputs.expected_api }}
          DEV_SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
          DEV_SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
          DEV_SERVER_PASSWORD: ${{ secrets.DEV_SERVER_PASSWORD }}
          DEV_SSH_HOST_KEY_SHA256: ${{ vars.DEV_SSH_HOST_KEY_SHA256 }}
