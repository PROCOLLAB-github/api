name: DEV default project name inspection
on:
  workflow_dispatch:
  push:
    branches:
      - ops/dev-default-project-name-check-20261004
permissions:
  contents: read
concurrency:
  group: dev-default-project-name-inspection-20261016
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/ops/dev-default-project-name-check-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed names and leader list without changing data
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command: |
            bash -se 2>&1 <<'DEV_INSPECT'
            set -Eeuo pipefail
            repo=/root/api
            test "$(readlink -f "$repo")" = "$repo"
            grep -Eq 'server_name[[:space:]]+dev\.procollab\.ru;' /etc/nginx/sites-enabled/dev.procollab.ru
            source_sha=$(git --no-optional-locks -C "$repo" rev-parse HEAD)
            test "$source_sha" = '81bd6fecc97e8f4355f8ca26f15aa780cf607fe4'
            printf 'DEV_SOURCE_SHA=%s\n' "$source_sha"
            image="procollab-dev-api:${source_sha}"
            source_image_id=$(docker image inspect -f '{{.Id}}' "$image")
            for service in web celerys; do
              container=$(docker ps -q --no-trunc --filter "label=com.docker.compose.project.working_dir=$repo" --filter "label=com.docker.compose.service=$service")
              [[ "$container" =~ ^[0-9a-f]{64}$ ]]
              test "$(docker inspect -f '{{.Image}}' "$container")" = "$source_image_id"
              printf 'DEV_SERVICE=%s\n' "$service"
              docker inspect -f '{"image_reference":{{json .Config.Image}},"image_id":{{json .Image}},"status":{{json .State.Status}}}' "$container"
            done
            printf 'DEV_RUNTIME_MATCHES_SOURCE=true\n'
            cd "$repo"
            export DEPLOY_IMAGE="$image"
            docker compose -f docker-compose.dev-ci.yml exec -T web python - <<'PY'
            import os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'procollab.settings')
            import django
            django.setup()
            from django.db import connection
            with connection.cursor() as cursor:
                cursor.execute('SET default_transaction_read_only = on')
            from django.db.migrations.executor import MigrationExecutor
            from projects.models import Project
            executor = MigrationExecutor(connection)
            executor.loader.check_consistent_history(connection)
            plan = executor.migration_plan(executor.loader.graph.leaf_nodes())
            print('DEV_PENDING_MIGRATIONS=' + repr([(m.app_label, m.name, backwards) for m, backwards in plan]), flush=True)
            assert not plan, 'Pending migrations remain'
            applied = ('projects', '0034_default_project_name') in executor.loader.applied_migrations
            print('DEV_DEFAULT_NAME_MIGRATION_APPLIED=' + str(applied), flush=True)
            assert applied
            from django.db.models import Q
            pattern = '^[\t\n\v\f\r\x1c-\x1f \x85\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*$'
            blanks = Project.objects.filter(Q(name__isnull=True) | Q(name__regex=pattern)).count()
            defaults = Project.objects.filter(name='Проект без названия').count()
            print('DEV_BLANK_PROJECT_NAME_COUNT=' + str(blanks), flush=True)
            print('DEV_DEFAULT_PROJECT_NAME_COUNT=' + str(defaults), flush=True)
            assert blanks == 0
            assert Project._meta.get_field('name').get_default() == 'Проект без названия'
            from django.contrib.auth import get_user_model
            from django.urls import resolve
            from rest_framework.test import APIRequestFactory, force_authenticate
            # The account currently signed in to the dev browser.
            leader = get_user_model().objects.get(pk=28)
            path = '/auth/users/projects/leader/'
            request = APIRequestFactory().get(path, {'limit': 1000}, secure=True, HTTP_HOST='dev.procollab.ru')
            force_authenticate(request, user=leader)
            response = resolve(path).func(request)
            print('DEV_LEADER_LIST_STATUS=' + str(response.status_code), flush=True)
            assert response.status_code == 200
            entries = response.data['results']
            matches = sum(item.get('name') == 'Проект без названия' for item in entries)
            assert matches > 0
            assert all(item.get('name') and item['name'].strip() for item in entries)
            print('DEV_LEADER_LIST_DEFAULT_NAME_MATCH_COUNT=' + str(matches), flush=True)
            print('DEV_LEADER_LIST_ALL_NAMES_PERSISTED=True', flush=True)
            PY
            printf 'DEV_READONLY_INSPECTION_COMPLETE=true\n'
            DEV_INSPECT
