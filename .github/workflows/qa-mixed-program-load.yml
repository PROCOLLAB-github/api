name: Mixed program workload (QA)

on:
  push:
    branches: [qa/dev-program-mixed-load-20261126]

permissions:
  contents: read

jobs:
  benchmark:
    name: PostgreSQL / ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: with-exports-first
            modes: "1 0"
          - order: without-exports-first
            modes: "0 1"
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: procollab_ci
          POSTGRES_USER: procollab_ci
          POSTGRES_PASSWORD: procollab_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procollab_ci -d procollab_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: procollab.settings_ci
      DJANGO_SECRET_KEY: isolated-ci-only-program-mixed-load-key
      DEBUG: "False"
      DATABASE_NAME: procollab_ci
      DATABASE_USER: procollab_ci
      DATABASE_PASSWORD: procollab_ci_password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      ALLOW_REACT_DEV_DEMO_SEED: "False"
      AUTOPOSTING_ON: "False"
      PROCOLLAB_PERF_MIXED: "1"
      PROCOLLAB_PERF_IMPLEMENTATION: ${{ github.sha }}
      PROCOLLAB_PERF_ORDER: ${{ matrix.modes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fontconfig poppler-utils
          python -m pip install "poetry==2.5.1"
          poetry install --no-interaction --no-ansi --no-root
      - name: Compare matched traffic with and without concurrent Excel exports
        run: |
          mkdir -p perf-results
          poetry run flake8 tools/performance/mixed_workload.py
          for exports in $PROCOLLAB_PERF_ORDER; do
            PROCOLLAB_PERF_WITH_EXPORTS="$exports" \
            PROCOLLAB_PERF_OUTPUT="perf-results/mixed-exports-$exports.json" \
              /usr/bin/time -v -o "perf-results/runner-usage-$exports.txt" \
              poetry run python manage.py test tools.performance.mixed_workload --verbosity 2
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-program-workload-${{ matrix.order }}
          path: perf-results/
          if-no-files-found: ignore
