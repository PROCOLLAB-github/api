name: Inspect Prod Analytics Checkout

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production checkout without mutations
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command: |
            set -eu
            appgit() {
              if [ "$(id -un)" = app ]; then
                git -C /home/app/procollab-backend "$@"
              else
                sudo -u app git -C /home/app/procollab-backend "$@"
              fi
            }
            echo PROD_CHECKOUT_HEAD
            appgit rev-parse HEAD
            echo PROD_CHECKOUT_STATUS
            appgit status --short
            echo PROD_NOTIFICATION_PATCH
            appgit diff HEAD -- notifications/models.py
            echo PROD_RUNTIME_IMAGES
            docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
            echo PROD_INSPECTION_OK
