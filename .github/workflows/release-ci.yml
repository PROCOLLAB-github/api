name: Funnel PROD read-only diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prod-funnel-diagnostics-20261017
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/ops/prod-funnel-diagnostics-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact analytics release and real counters without DB writes
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command: |
            set -eu
            repo=/home/app/procollab-backend
            if [ "$(id -un)" = app ]; then
              actual_ref="$(git -C "$repo" rev-parse HEAD)"
            else
              actual_ref="$(sudo -n -u app git -C "$repo" rev-parse HEAD)"
            fi
            test "$actual_ref" = 923c769b00b6ca4a906496fa526a5d9bdd54213b
            export IMAGE_TAG=prod-analytics-20261017-923c769b00b6
            cd "$repo"
            container="$(docker compose -f docker-compose.prod-ci.yml -p prod ps -q web)"
            test -n "$container"
            actual_image="$(docker inspect -f '{{.Config.Image}}' "$container")"
            test "$actual_image" = ghcr.io/procollab-github/api:prod-analytics-20261017-923c769b00b6
            echo PROD_ANALYTICS_IMAGE_AND_REF_OK
            docker exec -i -e PYTHONDONTWRITEBYTECODE=1 "$container" python manage.py shell <<'READONLY_ANALYTICS_PY'
            """Diagnose the screenshot cohort with aggregate SELECTs; never writes user data."""
            import json
            from django.db import connection, transaction
            from django.db.models import Count, Max, Min, Q
            from django.db.migrations.recorder import MigrationRecorder
            from partner_programs.models import PartnerProgramUserProfile
            from partner_programs.services.project_analytics import _participant_profiles

            with transaction.atomic():
                with connection.cursor() as cursor:
                    cursor.execute('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY')
                    cursor.execute("SET LOCAL statement_timeout = '15s'")
                    cursor.execute('SHOW transaction_read_only')
                    assert cursor.fetchone()[0] == 'on'
                groups = list(PartnerProgramUserProfile.objects.filter(user_id__isnull=False)
                              .order_by().values('partner_program_id')
                              .annotate(total=Count('user_id', distinct=True)))
                candidates = sorted(groups, key=lambda row: abs(row['total'] - 494))[:3]
                applied = MigrationRecorder.Migration.objects.filter(
                    app='users', name='0059_customuser_last_activity').values_list('applied', flat=True).first()
                results = []
                for candidate in candidates:
                    program_id = candidate['partner_program_id']
                    profiles = _participant_profiles(program_id).filter(user_id__isnull=False)
                    visits = Q(user__last_activity__isnull=False) | Q(user__last_login__isnull=False)
                    no_visit = Q(user__last_activity__isnull=True, user__last_login__isnull=True)
                    team = Q(is_leader=True) | Q(is_collaborator=True)
                    stats = profiles.aggregate(
                        registered=Count('user_id', distinct=True),
                        visits=Count('user_id', filter=visits, distinct=True),
                        with_team=Count('user_id', filter=team, distinct=True),
                        with_team_and_visit=Count('user_id', filter=team & visits, distinct=True),
                        with_team_without_visit=Count('user_id', filter=team & no_visit, distinct=True),
                        visited_without_team=Count('user_id', filter=visits & ~team, distinct=True),
                        leaders_without_visit=Count('user_id', filter=Q(is_leader=True) & no_visit, distinct=True),
                        collaborators_without_visit=Count('user_id', filter=Q(is_collaborator=True) & no_visit, distinct=True),
                    )
                    missing = profiles.filter(team & no_visit)
                    dates = missing.aggregate(first_account=Min('user__date_joined'), last_account=Max('user__date_joined'))
                    before_tracking = missing.filter(user__date_joined__lt=applied).values('user_id').distinct().count() if applied else None
                    assert stats['with_team'] == stats['with_team_and_visit'] + stats['with_team_without_visit']
                    assert stats['visits'] == stats['with_team_and_visit'] + stats['visited_without_team']
                    results.append({'program_id': program_id, **stats,
                                    'missing_team_accounts_created_before_activity_migration': before_tracking,
                                    'missing_team_account_dates': dates,
                                    'matches_screenshot': (stats['registered'], stats['visits'], stats['with_team']) == (494, 188, 251)})
                print(json.dumps({'read_only': True, 'activity_migration_applied_at': applied,
                                  'programs': results}, default=str, sort_keys=True))
            print('PROD_FUNNEL_DIAGNOSTICS_READONLY_OK')

            READONLY_ANALYTICS_PY
