name: PROD guarded disk headroom recovery for release 777

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Expected release image
        required: true
        type: string
      deploy_ref:
        description: Expected release source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prod-disk-pr777-20261016
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/ops/prod-disk-pr777-20261016' && inputs.deploy_ref == '620ebf71734b33df2a63479bc870b285882215be' && inputs.image_tag == 'prod-pr777-620ebf71734b-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reclaim one obsolete cached image and verify release
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command: |
            bash -se <<'WRAPPER'
            runner=(bash -se)
            if [ "$(id -u)" != 0 ]; then runner=(sudo -n bash -se); fi
            "${runner[@]}" <<'VERIFY'
            set -Eeuo pipefail
            test '${{ github.run_attempt }}' = 1
            repo=/home/app/procollab-backend
            test "$(readlink -f "$repo")" = "$repo"
            test "$(sudo -n -u app git --no-optional-locks -C "$repo" rev-parse HEAD)" = 620ebf71734b33df2a63479bc870b285882215be
            for service in web celerys; do
              container=$(docker ps -q --no-trunc --filter label=com.docker.compose.project=prod --filter "label=com.docker.compose.service=$service")
              [[ "$container" =~ ^[0-9a-f]{64}$ ]]
              test "$(docker inspect -f '{{.Config.Image}}' "$container")" = ghcr.io/procollab-github/api:prod-pr777-620ebf71734b-20261016
              test "$(docker inspect -f '{{.State.Status}}' "$container")" = running
              docker inspect -f '{"service":"'"$service"'","image_reference":{{json .Config.Image}},"image_id":{{json .Image}},"status":{{json .State.Status}},"restart_count":{{json .RestartCount}}}' "$container"
              if test "$service" = web; then web=$container; fi
            done
            python3 - <<'CACHE'
            import json
            import re
            import shutil
            import subprocess
            from pathlib import Path

            # Exact unused June image from diagnostic run 38901180424.
            image = 'sha256:8a08cdbfccc54c150ada6589a03adafe3135c756e5d427e2da6601422dfd06b8'
            tag = 'ghcr.io/procollab-github/api:2c6e31a52331b2841d3d5a536a7ba361874beacf'
            digest = 'ghcr.io/procollab-github/api@sha256:8917865465dce08c7648c6067f829824581538095c12389f3792dfff6a87f9a5'

            def docker(*args):
                return subprocess.check_output(['docker', *args], text=True).strip()

            def images():
                return set(docker('image', 'ls', '-a', '--no-trunc', '--digests',
                                  '--format', '{{.ID}} {{.Repository}} {{.Tag}} {{.Digest}}').splitlines())

            def containers():
                return {value: docker('inspect', '-f',
                        '{{.Id}} {{.Image}} {{.State.Status}} {{.State.StartedAt}} {{.RestartCount}}', value)
                        for value in docker('ps', '-aq', '--no-trunc').splitlines()}

            rollback = set()
            base = Path('/var/backups/procollab-prod-analytics-cover')
            assert base.is_dir() and not base.is_symlink()
            for name in ('web.json', 'celerys.json', 'web-after.json', 'celerys-after.json'):
                for path in base.glob('*/' + name):
                    assert not path.is_symlink() and not path.parent.is_symlink()
                    assert base.resolve() in path.resolve().parents and path.stat().st_size < 8192
                    value = json.loads(path.read_text())['image_id']
                    assert re.fullmatch(r'sha256:[0-9a-f]{64}', value)
                    rollback.add(value)
            assert rollback and image not in rollback
            assert docker('image', 'inspect', '-f', '{{.Id}}', tag) == image
            assert json.loads(docker('image', 'inspect', '-f', '{{json .RepoTags}}', image)) == [tag]
            assert digest in json.loads(docker('image', 'inspect', '-f', '{{json .RepoDigests}}', image))
            before_containers = containers()
            assert all(docker('inspect', '-f', '{{.Image}}', value) != image for value in before_containers)
            assert not docker('ps', '-aq', '--filter', 'ancestor=' + image)
            # Verify the exact immutable remote manifest is still available before evicting its local cache.
            subprocess.run(['docker', 'manifest', 'inspect', digest], check=True,
                           stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=120)
            print('OBSOLETE_IMAGE_REMOTE_MANIFEST_AVAILABLE=true', flush=True)
            protected_images = {line for line in images() if line.split()[0] != image}
            before_volumes = docker('volume', 'ls', '--format', '{{.Driver}} {{.Name}}')
            subprocess.run(['docker', 'image', 'rm', '--no-prune', tag], check=True)
            assert images() == protected_images
            assert containers() == before_containers
            assert docker('volume', 'ls', '--format', '{{.Driver}} {{.Name}}') == before_volumes
            assert shutil.disk_usage('/').free >= 1536 * 1024 * 1024
            print('PROTECTED_IMAGES_UNCHANGED=true\nCONTAINERS_UNCHANGED=true\nVOLUMES_UNCHANGED=true', flush=True)
            print('DISK_HEADROOM_AT_LEAST_1_5_GIB=true', flush=True)
            CACHE
            printf 'DISK_AFTER_RELEASE\n'
            df -h / /var/lib/docker
            df -i /
            docker exec -i "$web" python - <<'PY'
            import json
            import os
            import urllib.request

            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'procollab.settings')
            import django
            django.setup()
            from django.db import connection, transaction
            from partner_programs.models import PartnerProgramProject

            # Explicitly read-only transaction; choose an existing public published project.
            with transaction.atomic():
                with connection.cursor() as cursor:
                    cursor.execute('SET TRANSACTION READ ONLY')
                link = (PartnerProgramProject.objects
                        .filter(project__is_public=True, project__draft=False)
                        .select_related('partner_program').order_by('pk').first())
                if link is None:
                    print('PUBLIC_PROGRAM_PROJECT_UNAVAILABLE=true', flush=True)
                else:
                    url = 'https://api.procollab.ru/projects/' + str(link.project_id) + '/'
                    request = urllib.request.Request(url, headers={'Accept': 'application/json'})
                    with urllib.request.urlopen(request, timeout=30) as response:
                        assert response.status == 200
                        payload = json.load(response)
                    program = payload['partner_program']
                    assert program['program_link_id'] == link.pk
                    assert program['program_id'] == link.partner_program_id
                    assert program['name'] == link.partner_program.name
                    print('PUBLIC_PROJECT_ID=' + str(link.project_id), flush=True)
                    print('PUBLIC_PROJECT_HTTP_STATUS=200\nPARTNER_PROGRAM_NAME_MATCH=true', flush=True)
            print('PUBLIC_API_CONTRACT_VERIFICATION_COMPLETE=true', flush=True)
            PY
            printf 'PROD_RELEASE_VERIFICATION_COMPLETE=true\n'
            VERIFY
            WRAPPER
