name: Analytics PROD read-only verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prod-chat-analytics-readonly-20261017
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/ops/prod-chat-analytics-readonly-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact analytics release and real counters without DB writes
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command: |
            set -eu
            repo=/home/app/procollab-backend
            if [ "$(id -un)" = app ]; then
              actual_ref="$(git -C "$repo" rev-parse HEAD)"
            else
              actual_ref="$(sudo -n -u app git -C "$repo" rev-parse HEAD)"
            fi
            test "$actual_ref" = 923c769b00b6ca4a906496fa526a5d9bdd54213b
            export IMAGE_TAG=prod-analytics-20261017-923c769b00b6
            cd "$repo"
            container="$(docker compose -f docker-compose.prod-ci.yml -p prod ps -q web)"
            test -n "$container"
            actual_image="$(docker inspect -f '{{.Config.Image}}' "$container")"
            test "$actual_image" = ghcr.io/procollab-github/api:prod-analytics-20261017-923c769b00b6
            echo PROD_ANALYTICS_IMAGE_AND_REF_OK
            docker exec -i -e PYTHONDONTWRITEBYTECODE=1 "$container" python manage.py shell <<'READONLY_ANALYTICS_PY'
            """Bounded verification of real analytics, in a read-only database transaction."""
            from datetime import timedelta
            import json

            from django.db import connection, transaction
            from django.db.models import Count, Q
            from django.utils import timezone
            from partner_programs.models import PartnerProgram, PartnerProgramProject, PartnerProgramUserProfile
            from partner_programs.serializers.project_analytics import ProjectAnalyticsSerializer
            from partner_programs.serializers.project_case_drilldown import ProjectCaseQuerySerializer
            from partner_programs.services.project_analytics import build_project_analytics, participants_without_visit_rows
            from partner_programs.services.project_assignment_analytics import build_assignments, build_delayed_experts
            from partner_programs.services.project_case_analytics import get_program_case_field
            from partner_programs.services.project_case_drilldown import case_project_rows

            with transaction.atomic():
                with connection.cursor() as cursor:
                    cursor.execute('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY')
                    cursor.execute("SET LOCAL statement_timeout = '15s'")
                    cursor.execute('SHOW transaction_read_only')
                    assert cursor.fetchone()[0] == 'on'
                # The indexed program foreign key gives at most three distinct programs with projects.
                ids = list(PartnerProgramProject.objects.order_by('-partner_program_id')
                           .values_list('partner_program_id', flat=True).distinct()[:3])
                assert ids, 'No programs with project links found for the read-only sample'
                results = []
                for program in PartnerProgram.objects.filter(pk__in=ids).order_by('pk'):
                    now = timezone.now()
                    overview = build_project_analytics(program, now=now)
                    serializer = ProjectAnalyticsSerializer(data=overview)
                    serializer.is_valid(raise_exception=True)
                    profiles = PartnerProgramUserProfile.objects.filter(partner_program_id=program.pk, user_id__isnull=False)
                    metrics = profiles.aggregate(
                        total=Count('user_id', distinct=True),
                        visits=Count('user_id', filter=Q(user__last_activity__isnull=False) | Q(user__last_login__isnull=False), distinct=True),
                        missing=Count('user_id', filter=Q(user__last_activity__isnull=True, user__last_login__isnull=True), distinct=True),
                    )
                    funnel, attention = overview['participant_funnel'], overview['attention']
                    assert metrics['total'] == metrics['visits'] + metrics['missing']
                    assert funnel['unique_participants'] == metrics['total']
                    assert funnel['visited_participants'] == metrics['visits']
                    assert attention['participants_without_visit'] == metrics['missing']
                    assert participants_without_visit_rows(program.pk).count() == metrics['missing']

                    field = get_program_case_field(program)
                    context = {'case_options': field.get_options_list() if field else [],
                               'submission_applicable': program.is_competitive}
                    counts = {}
                    submissions = ('all', 'submitted', 'not_submitted') if program.is_competitive else ('all',)
                    for submission in submissions:
                        for presentation in ('all', 'present', 'missing'):
                            query = ProjectCaseQuerySerializer(data={
                                'view': 'case_analytics', 'case_scope': 'all',
                                'submission': submission, 'presentation': presentation,
                            }, context=context)
                            query.is_valid(raise_exception=True)
                            counts[submission, presentation] = case_project_rows(
                                program, field=field, selection=query.validated_data).count()
                        assert counts[submission, 'all'] == counts[submission, 'present'] + counts[submission, 'missing']
                    if program.is_competitive:
                        for presentation in ('all', 'present', 'missing'):
                            assert counts['all', presentation] == counts['submitted', presentation] + counts['not_submitted', presentation]
                    assert counts['all', 'all'] == overview['solution_funnel']['created']

                    if program.datetime_evaluation_ends and program.is_distributed_evaluation:
                        assignments = build_assignments(program.pk, now=now)
                        cutoff = program.datetime_evaluation_ends - timedelta(days=5)
                        early = build_delayed_experts(assignments, evaluation_ends=program.datetime_evaluation_ends,
                                                     now=cutoff - timedelta(seconds=1))
                        assert early['total'] == 0
                        at_cutoff = build_delayed_experts(assignments, evaluation_ends=program.datetime_evaluation_ends,
                                                         now=cutoff)
                        pending = {row['expert']['expert_id'] for row in assignments
                                   if row['status'] in ('pending', 'in_progress') and row['project_submitted']}
                        assert at_cutoff['total'] == len(pending)
                    results.append({'program_id': program.pk, 'participants': metrics['total'],
                                    'visited': metrics['visits'], 'without_visit': metrics['missing'],
                                    'projects': counts['all', 'all'], 'filter_combinations': len(counts),
                                    'serializer_valid': True})
                assert results, 'No existing programs found for the read-only sample'
                print(json.dumps({'read_only': True, 'sample_programs': results}, sort_keys=True))
            print('PROD_CHAT_ANALYTICS_READONLY_OK')

            READONLY_ANALYTICS_PY
