name: University PROD read-only verification
on:
  push:
    branches: [ops/prod-university-rollout-20261016]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: university-prod-rollout-20261016
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/ops/prod-university-rollout-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed release, directory and preserved education
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command: |
            bash -se <<'WRAPPER'
            runner=(bash -se)
            if [ "$(id -u)" != 0 ]; then runner=(sudo -n bash -se); fi
            "${runner[@]}" <<'REMOTE'
            set -Eeuo pipefail
            repo=/home/app/procollab-backend
            test "$(readlink -f "$repo")" = "$repo"
            sudo -n -u app git -C "$repo" fetch origin ops/prod-university-rollout-20261016
            sudo -n -u app git -C "$repo" show '${{ github.sha }}:.github/scripts/university-prod-guard.sh' |
              bash -se -- verify f028a340d10d2092e5d3ecc041d4099a589f68f3 '${{ github.sha }}'
            REMOTE
            WRAPPER
