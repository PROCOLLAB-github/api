name: PROD default project name preflight
on:
  workflow_dispatch:
  push:
    branches: [ops/prod-default-project-name-20261016]
permissions:
  contents: read
concurrency:
  group: prod-default-project-name-inspection-20261016
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/ops/prod-default-project-name-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production runtime and project names without changing data
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command: |
            bash -se 2>&1 <<'PROD_INSPECT'
            set -Eeuo pipefail
            repo=/home/app/procollab-backend
            test "$(readlink -f "$repo")" = "$repo"
            if [ "$(id -un)" = app ]; then
              source_sha=$(git --no-optional-locks -C "$repo" rev-parse HEAD)
            else
              source_sha=$(sudo -n -u app git --no-optional-locks -C "$repo" rev-parse HEAD)
            fi
            test "$source_sha" = '620ebf71734b33df2a63479bc870b285882215be'
            printf 'PROD_SOURCE_SHA=%s\n' "$source_sha"
            df -h / /var/lib/docker
            python3 - <<'PY'
            import os
            available = os.statvfs('/').f_bavail * os.statvfs('/').f_frsize
            print('PROD_DISK_AVAILABLE_BYTES=' + str(available), flush=True)
            assert available >= 1610612736, 'Less than 1.5 GiB free before release'
            PY
            web=''
            for service in web celerys; do
              container=$(docker ps -q --no-trunc --filter label=com.docker.compose.project=prod --filter "label=com.docker.compose.service=$service")
              [[ "$container" =~ ^[0-9a-f]{64}$ ]]
              test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$container")" = "$repo"
              printf 'PROD_SERVICE=%s\n' "$service"
              docker inspect -f '{"image_reference":{{json .Config.Image}},"image_id":{{json .Image}},"status":{{json .State.Status}},"restart_count":{{.RestartCount}}}' "$container"
              if [ "$service" = web ]; then web="$container"; fi
            done
            docker exec -i "$web" python - <<'PY'
            import os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'procollab.settings')
            import django
            django.setup()
            from django.db import connection
            with connection.cursor() as cursor:
                cursor.execute('SET default_transaction_read_only = on')
            from django.db.migrations.executor import MigrationExecutor
            executor = MigrationExecutor(connection)
            executor.loader.check_consistent_history(connection)
            plan = executor.migration_plan(executor.loader.graph.leaf_nodes())
            print('PROD_PENDING_MIGRATIONS=' + repr([(m.app_label, m.name) for m, _ in plan]), flush=True)
            assert not plan
            from projects.models import Project
            from django.db.models import Q
            pattern = '^[\t\n\v\f\r\x1c-\x1f \x85\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*$'
            print('PROD_PROJECT_COUNT=' + str(Project.objects.count()), flush=True)
            print('PROD_BLANK_PROJECT_NAME_COUNT=' + str(Project.objects.filter(Q(name__isnull=True) | Q(name__regex=pattern)).count()), flush=True)
            print('PROD_DEFAULT_PROJECT_NAME_COUNT=' + str(Project.objects.filter(name='Проект без названия').count()), flush=True)
            print('PROD_DEFAULT_NAME_MIGRATION_APPLIED=' + str(('projects', '0034_default_project_name') in executor.loader.applied_migrations), flush=True)
            PY
            root_status=$(curl -s -o /dev/null -w '%{http_code}' https://api.procollab.ru/)
            admin_status=$(curl -s -o /dev/null -w '%{http_code}' https://api.procollab.ru/admin/login/)
            printf 'PROD_ROOT_HTTP=%s\nPROD_ADMIN_HTTP=%s\n' "$root_status" "$admin_status"
            test "$root_status" = 401
            test "$admin_status" = 200
            printf 'PROD_BASELINE_READONLY_COMPLETE=true\n'
            PROD_INSPECT
