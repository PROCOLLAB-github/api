name: Preserve Blocked Prod Analytics File

on:
  workflow_dispatch:

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve only conflicting local file
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command: |
            set -eu
            appgit() {
              if [ "$(id -un)" = app ]; then
                git -C /home/app/procollab-backend "$@"
              else
                sudo -u app git -C /home/app/procollab-backend "$@"
              fi
            }
            test "$(appgit rev-parse HEAD)" = 923c769b00b6ca4a906496fa526a5d9bdd54213b
            test -f /home/app/procollab-backend/notifications/models.py
            test ! -s /home/app/procollab-backend/notifications/models.py
            appgit diff --cached --quiet
            appgit stash push -m 'prod-analytics-20261021-preserve-empty-notification-model' -- notifications/models.py
            echo PROD_CONFLICT_BACKUP_COMMIT
            appgit rev-parse refs/stash
            appgit diff --quiet HEAD -- notifications/models.py
            echo PROD_CHECKOUT_UNBLOCKED
