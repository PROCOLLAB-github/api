name: University PROD rollout guard
on:
  push:
    branches: [ops/prod-university-rollout-20261016]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [inspect, diagnose, reclaim, snapshot, plan, verify, release]
        default: inspect
        required: true
      backend_sha:
        type: string
        required: false
        default: ''
      tested_sha:
        type: string
        required: false
        default: ''
      image_tag:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  packages: write
  actions: read
concurrency:
  group: university-prod-rollout-20261016
  cancel-in-progress: false
jobs:
  guard:
    if: github.ref == 'refs/heads/ops/prod-university-rollout-20261016' && inputs.phase != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify immutable rollback cache manifests remain recoverable
        id: registry
        if: inputs.phase == 'reclaim'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker buildx imagetools inspect ghcr.io/procollab-github/api@sha256:510365cd95106933532ea44f958f7062833c2db1d06ad8f16c9aa543942e321b >/dev/null
          docker buildx imagetools inspect ghcr.io/procollab-github/api@sha256:f1fc114ece6330e8a6ce6f2b1a18a5329339205480a53d7b92887b9e28bf0af0 >/dev/null
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - name: Inspect, preserve or verify production education
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command: |
            bash -se <<'WRAPPER'
            runner=(bash -se)
            if [ "$(id -u)" != 0 ]; then runner=(sudo -n bash -se); fi
            "${runner[@]}" <<'REMOTE'
            set -Eeuo pipefail
            repo=/home/app/procollab-backend
            test "$(readlink -f "$repo")" = "$repo"
            sudo -n -u app git -C "$repo" fetch origin ops/prod-university-rollout-20261016
            sudo -n -u app git -C "$repo" show '${{ github.sha }}:.github/scripts/university-prod-guard.sh' |
              bash -se -- '${{ github.event.inputs.phase || 'inspect' }}' '${{ github.event.inputs.backend_sha }}' '${{ github.sha }}' '${{ steps.registry.outputs.verified }}'
            REMOTE
            WRAPPER

  prepare:
    if: github.ref == 'refs/heads/ops/prod-university-rollout-20261016' && inputs.phase == 'release'
    name: Verify exact tested production tree
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      deploy_ref: ${{ steps.vars.outputs.deploy_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful full CI and matching immutable tree
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REF: ${{ inputs.backend_sha }}
          TESTED_REF: ${{ inputs.tested_sha }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TESTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$IMAGE_TAG" = "prod-university-${DEPLOY_REF:0:12}-20261016"
          test "$(git rev-parse origin/master)" = "$DEPLOY_REF"
          test "$(git rev-parse "$DEPLOY_REF^{tree}")" = "$(git rev-parse "$TESTED_REF^{tree}")"
          gh api "repos/${{ github.repository }}/actions/runs?head_sha=$TESTED_REF&per_page=100" > "$RUNNER_TEMP/university-ci-proof.json"
          python3 - "$RUNNER_TEMP/university-ci-proof.json" "$TESTED_REF" <<'PY'
          import json
          import sys
          runs = json.load(open(sys.argv[1]))['workflow_runs']
          for name in ('CI', 'Backend PostgreSQL CI'):
              matches = [run for run in runs if run['head_sha'] == sys.argv[2] and run['name'] == name]
              assert matches, name
              run = max(matches, key=lambda item: item['id'])
              assert run['status'] == 'completed' and run['conclusion'] == 'success', (name, run['status'], run['conclusion'])
              print('VERIFIED_CI=' + name + ':' + str(run['id']))
          PY
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "deploy_ref=$DEPLOY_REF" >> "$GITHUB_OUTPUT"
          echo 'EXACT_TESTED_TREE_VERIFIED=true'
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [ prepare ]
    outputs:
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      deploy_ref: ${{ needs.prepare.outputs.deploy_ref }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.prepare.outputs.deploy_ref }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to GitHub Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/procollab-github/api
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.deploy_ref }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.image_tag }}
      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.deploy_ref }}
            org.opencontainers.image.source=https://github.com/PROCOLLAB-github/api
  deploy:
      name: Deploy
      runs-on: ubuntu-latest
      needs: [ prepare, build ]
      steps:
        - name: Deploy to server
          uses: garygrossgarten/github-action-ssh@release
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            password: ${{ secrets.SERVER_PASSWORD }}
            command: |
              bash -se <<'WRAPPER'
              runner=(bash -se)
              if [ "$(id -u)" != 0 ]; then runner=(sudo -n bash -se); fi
              "${runner[@]}" <<'PROD_RELEASE'
              set -Eeuo pipefail
              umask 077

              snapshot=/var/backups/procollab-prod-university-20261016
              test -f "$snapshot/COMPLETE"
              test -z "$(sudo -n -u app git -C /home/app/procollab-backend status --porcelain --untracked-files=no)"
              test -s "$snapshot/database-before.dump"
              test -s "$snapshot/education-before.json"
              test "$(sudo -n -u app git --no-optional-locks -C /home/app/procollab-backend rev-parse HEAD)" = "$(cat "$snapshot/backend-source-before.txt")"
              running=$(docker ps -q --no-trunc --filter label=com.docker.compose.project=prod --filter label=com.docker.compose.service=web)
              test "$(docker inspect -f '{{.Image}}' "$running")" = "$(cat "$snapshot/backend-image-id-before.txt")"
              available=$(df -PB1 / | awk 'NR==2 {print $4}')
              test "$available" -ge 3000000000
              export IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
              export DEPLOY_REF="${{ needs.prepare.outputs.deploy_ref }}"
              echo "Deploying IMAGE_TAG=${IMAGE_TAG} from DEPLOY_REF=${DEPLOY_REF}"

              if [ "$(id -un)" = "app" ]; then
                git -C /home/app/procollab-backend fetch --all --tags --prune
                git -C /home/app/procollab-backend checkout --detach "${DEPLOY_REF}"
                git -C /home/app/procollab-backend rev-parse HEAD
              else
                sudo -u app git -C /home/app/procollab-backend fetch --all --tags --prune
                sudo -u app git -C /home/app/procollab-backend checkout --detach "${DEPLOY_REF}"
                sudo -u app git -C /home/app/procollab-backend rev-parse HEAD
              fi

              cd /home/app/procollab-backend
              chmod 600 .env
              docker compose -f docker-compose.prod-ci.yml -p prod config >/dev/null
              docker compose -f docker-compose.prod-ci.yml -p prod pull web celerys

              sudo -n -u app git -C /home/app/procollab-backend show '${{ github.sha }}:.github/scripts/university-prod-checkpoint.sh' |
                bash -se -- "$running" '${{ github.sha }}' '${{ github.run_id }}' '${{ github.run_attempt }}'

              docker compose -f docker-compose.prod-ci.yml -p prod run --rm -T web python manage.py migrate --noinput
              docker compose -f docker-compose.prod-ci.yml -p prod up -d --no-deps --force-recreate web celerys
              expected_image="ghcr.io/procollab-github/api:${IMAGE_TAG}"
              for service in web celerys; do
                container="$(docker compose -f docker-compose.prod-ci.yml -p prod ps -q "$service")"
                if [ -z "$container" ]; then
                  echo "Service ${service} has no running container" >&2
                  docker compose -f docker-compose.prod-ci.yml -p prod ps >&2 || true
                  exit 1
                fi

                actual_image="$(docker inspect -f '{{.Config.Image}}' "$container")"
                echo "Service ${service}: container=${container} image=${actual_image}"
                if [ "$actual_image" != "$expected_image" ]; then
                  echo "Service ${service} uses unexpected image: ${actual_image}, expected ${expected_image}" >&2
                  docker compose -f docker-compose.prod-ci.yml -p prod ps >&2 || true
                  exit 1
                fi
              done
              if [ "$(id -u)" -eq 0 ]; then
                nginx -t
                systemctl reload nginx
              else
                sudo nginx -t
                sudo systemctl reload nginx
              fi

              for attempt in $(seq 1 24); do
                root_status="$(curl -s -o /dev/null -w '%{http_code}' https://api.procollab.ru/ || true)"
                admin_status="$(curl -s -o /dev/null -w '%{http_code}' https://api.procollab.ru/admin/login/ || true)"

                if [ "$root_status" = "401" ] && [ "$admin_status" = "200" ]; then
                  echo "Smoke check passed on attempt ${attempt}"
                  break
                fi

                sleep 5
              done

              if [ "$root_status" != "401" ] || [ "$admin_status" != "200" ]; then
                echo "Smoke check failed: /=${root_status} /admin/login/=${admin_status}" >&2
                exit 1
              fi

              docker compose -f docker-compose.prod-ci.yml -p prod ps

              celery_status=""
              celery_ping=""
              celery_container=""
              for attempt in $(seq 1 12); do
                celery_container="$(docker compose -f docker-compose.prod-ci.yml -p prod ps -q celerys 2>/dev/null || true)"
                if [ -n "$celery_container" ]; then
                  celery_status="$(docker inspect -f '{{.State.Status}}' "$celery_container" 2>/dev/null || true)"
                else
                  celery_status="missing"
                fi

                echo "Celery check attempt ${attempt}: container=${celery_container:-missing} status=${celery_status}"
                if [ "$celery_status" = "running" ]; then
                  celery_ping="$(docker compose -f docker-compose.prod-ci.yml -p prod exec -T celerys sh -lc 'celery -A procollab inspect ping --timeout=15' 2>&1 || true)"
                  printf '%s\n' "$celery_ping"
                  if printf '%s\n' "$celery_ping" | grep -q 'pong'; then
                    echo "Celery check passed on attempt ${attempt}"
                    break
                  fi
                fi

                sleep 5
              done

              if [ "$celery_status" != "running" ] || ! printf '%s\n' "$celery_ping" | grep -q 'pong'; then
                echo "Celery check failed: status=${celery_status}" >&2
                docker compose -f docker-compose.prod-ci.yml -p prod ps >&2 || true
                docker compose -f docker-compose.prod-ci.yml -p prod logs --tail=200 celerys >&2 || true
                docker compose -f docker-compose.prod-ci.yml -p prod logs --tail=100 redis >&2 || true
                docker compose -f docker-compose.prod-ci.yml -p prod logs --tail=100 web >&2 || true
                exit 1
              fi
              PROD_RELEASE
              WRAPPER
