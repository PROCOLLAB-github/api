name: Participant export queue comparison (QA)

on:
  push:
    branches: [qa/dev-participant-export-queue-20261126]

permissions:
  contents: read

jobs:
  benchmark:
    name: PostgreSQL / ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: sync-first
            modes: "sync queued"
          - order: queued-first
            modes: "queued sync"
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: procollab_ci
          POSTGRES_USER: procollab_ci
          POSTGRES_PASSWORD: procollab_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procollab_ci -d procollab_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: procollab.settings_ci
      DJANGO_SECRET_KEY: isolated-ci-only-participant-export-queue-key
      DEBUG: "False"
      DATABASE_NAME: procollab_ci
      DATABASE_USER: procollab_ci
      DATABASE_PASSWORD: procollab_ci_password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      ALLOW_REACT_DEV_DEMO_SEED: "False"
      AUTOPOSTING_ON: "False"
      PROCOLLAB_PERF_PARTICIPANT_QUEUE: "1"
      PROCOLLAB_PERF_IMPLEMENTATION: ${{ github.sha }}
      PROCOLLAB_PERF_ORDER: ${{ matrix.order }}
      PROCOLLAB_PERF_MODES: ${{ matrix.modes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fontconfig poppler-utils
          python -m pip install "poetry==2.5.1"
          poetry install --no-interaction --no-ansi --no-root
      - name: Compare synchronous and queued participant exports
        run: |
          mkdir -p perf-results
          poetry run flake8 tools/performance/mixed_workload.py tools/performance/export_queue_worker.py
          status=0
          for mode in $PROCOLLAB_PERF_MODES; do
            PROCOLLAB_PERF_EXPORT_MODE="$mode" \
            PROCOLLAB_PERF_OUTPUT="perf-results/mixed-$mode.json" \
              /usr/bin/time -v -o "perf-results/runner-usage-$mode.txt" \
              poetry run python manage.py test tools.performance.mixed_workload --verbosity 2 || status=1
          done
          exit "$status"
      - name: Summarize the two modes for this runner
        if: always()
        run: python tools/performance/summarize_export_queue.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: participant-export-queue-${{ matrix.order }}
          path: perf-results/
          if-no-files-found: ignore
