name: Program management performance

on:
  push:
    branches: [perf/dev-program-management-20261126]
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/program-management-performance.yml"
      - "tools/performance/**"
      - "partner_programs/services/analytics.py"
      - "partner_programs/services/native_registration.py"
      - "partner_programs/services/participants_excel.py"
      - "partner_programs/solution_participants.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: PostgreSQL / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [small, large, pressure]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: procollab_ci
          POSTGRES_USER: procollab_ci
          POSTGRES_PASSWORD: procollab_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procollab_ci -d procollab_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: procollab.settings_ci
      DJANGO_SECRET_KEY: ci-only-program-performance-not-a-production-secret
      DEBUG: "False"
      DATABASE_NAME: procollab_ci
      DATABASE_USER: procollab_ci
      DATABASE_PASSWORD: procollab_ci_password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      ALLOW_REACT_DEV_DEMO_SEED: "False"
      AUTOPOSTING_ON: "False"
      PROCOLLAB_PERF_PROFILE: ${{ matrix.profile }}
      PROCOLLAB_PERF_IMPLEMENTATION: ${{ github.sha }}
      PROCOLLAB_PERF_OUTPUT: perf-results/program-management.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fontconfig poppler-utils
          python -m pip install "poetry==2.5.1"
          poetry install --no-interaction --no-ansi --no-root
      - name: Check workload, participant export and analytics
        if: matrix.profile == 'small'
        run: |
          poetry run flake8 tools/performance partner_programs/services/participants_excel.py \
            partner_programs/services/analytics.py partner_programs/services/native_registration.py \
            partner_programs/solution_participants.py
          poetry run python manage.py test --verbosity 2 \
            partner_programs.tests.test_management_participants \
            partner_programs.tests.test_native_registration \
            partner_programs.tests.test_manager_analytics_api \
            partner_programs.tests.test_attention_analytics_api \
            partner_programs.tests.test_solution_entrypoints \
            partner_programs.tests.test_solution_manager_analytics
      - name: Measure the original implementation on the same runner
        if: matrix.profile != 'pressure'
        run: |
          baseline=7967544bf9cc78c2e0833328b17e366382837c0d
          git fetch --no-tags --depth=1 origin "$baseline"
          baseline_dir="$RUNNER_TEMP/baseline"
          git worktree add --detach "$baseline_dir" "$baseline"
          mkdir -p "$baseline_dir/tools" "$GITHUB_WORKSPACE/perf-results/baseline"
          cp -r tools/performance "$baseline_dir/tools/"
          poetry_python="$(poetry env info --executable)"
          cd "$baseline_dir"
          PROCOLLAB_PERF_IMPLEMENTATION="$baseline" \
          PROCOLLAB_PERF_OUTPUT="$GITHUB_WORKSPACE/perf-results/baseline/program-management.json" \
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/perf-results/baseline/runner-usage.txt" \
            "$poetry_python" manage.py test tools.performance.program_management --verbosity 2
      - name: Measure representative operations over HTTP
        run: |
          mkdir -p perf-results
          /usr/bin/time -v -o perf-results/runner-usage.txt \
            poetry run python manage.py test tools.performance.program_management --verbosity 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-management-performance-${{ matrix.profile }}
          path: perf-results/
          if-no-files-found: ignore
