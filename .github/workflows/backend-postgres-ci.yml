name: Production dependency preflight (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-production-preflight:
    name: Read-only production preflight (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned SSH transport
        run: npm install --prefix "$RUNNER_TEMP/prod-preflight-ssh" --ignore-scripts --no-package-lock --no-audit --no-fund ssh2@1.16.0
      - name: Inspect existing production runtime without changes
        env:
          NODE_PATH: ${{ runner.temp }}/prod-preflight-ssh/node_modules
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          PROD_EXISTING_KNOWN_HOSTS: ${{ secrets.REACT_DEV_SSH_KNOWN_HOSTS }}
        run: node .github/scripts/prod_preflight_ssh.cjs
