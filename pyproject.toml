[tool.poetry]
name = "procollab-backend"
version = "0.1.0"
description = ""
authors = ["Sergey Yaksanov <sergeyyaksanov@yandex.ru>"]
readme = "README.md"
packages = []

[tool.black]
    line-length = 90
    include = '\.pyi?$'
    exclude = '''
    /(
        \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | _build
      | buck-out
      | build
      | dist
      | venv
      | migrations
      | blib2to3
      | tests/data
    )/
    '''

[tool.poetry.dependencies]
python = "^3.11"
djangorestframework = "^3.18.3"
flake8 = "^5.0.4"
python-decouple = "^3.6"
psycopg2-binary = "^2.9.4"
django-cleanup = "^9.0.0"
django-cors-headers = "^4.9.0"
django-debug-toolbar = "^8.0.0"
Pillow = "^13.0.0"
djangorestframework-simplejwt = {extras = ["crypto"], version = "^5.2.1"}
pre-commit = "^2.20.0"
black = "^26.10.1"
uritemplate = "^4.1.1"
pyyaml = { version = "!=6.0.0,!=5.4.0,!=5.4.1" }
django-rest-passwordreset = "^1.3.0"
django-filter = "^26.2"
setuptools = ">=84.1.0,<85"
drf-yasg = "^1.21.4"
whitenoise = "^6.2.0"
six = "^1.16.0"
aiohttp = "^3.8.3"
django = {extras = ["bcrypt"], version = ">=5.2.18,<5.3"}
# Preserve verification of legacy bcrypt passwords longer than 72 bytes.
bcrypt = ">=4.3,<5"
channels-redis = "^4.0.0"
channels = {extras = ["daphne"], version = "^4.0.0"}
django-taggit = "^7.0.0"
requests = "^2.34.2"
coreapi = "^2.3.3"
webp = "^0.4.0"
loguru = "^0.7.1"
tablib = {extras = ["xlsx"], version = "^3.5.0"}
django-redis = "^7.0.0"
django-stubs = {extras = ["compatible-mypy"], version = "^6.1.2"}
djangorestframework-stubs = {extras = ["compatible-mypy"], version = "^3.18.1"}
flake8-print = "^5.0.0"
flake8-variables-names = "^0.0.6"
pandas = "^2.2.1"
celery = "^5.4.0"
django-celery-beat = "^2.6.0"
weasyprint = "^70.0"
django-anymail = "^12.0"
phonenumbers = "^8.13.47"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
jsonschema = "4.26.0"
openapi-spec-validator = "0.7.2"
